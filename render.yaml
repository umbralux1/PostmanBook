# Render Blueprint: веб-сервис из Dockerfile + Postgres.
# Render → New → Blueprint → выберите репозиторий; дальше всё создастся само.
services:
  - type: web
    name: http-trainer
    runtime: docker
    plan: free            # free засыпает через 15 мин без запросов; starter — нет
    healthCheckPath: /healthz
    envVars:
      - key: TRAINER_DATABASE_URL
        fromDatabase:
          name: http-trainer-db
          property: connectionString
      # Миграции применяет команда запуска контейнера (alembic upgrade head).
      - key: TRAINER_AUTO_CREATE_TABLES
        value: "false"
      # Сайт работает только по HTTPS — cookie тоже только по HTTPS.
      - key: TRAINER_COOKIE_SECURE
        value: "true"

databases:
  - name: http-trainer-db
    plan: free            # бесплатная база Render удаляется через 30 дней — для курса возьмите платный план
