# Render Blueprint: веб-сервис из Dockerfile, база — файл SQLite.
# Render → New → Blueprint → выберите репозиторий.
services:
  - type: web
    name: http-trainer
    runtime: docker
    healthCheckPath: /healthz

    # ВНИМАНИЕ: на бесплатном плане файловая система временная — файл базы
    # (прогресс учеников, комнаты, имена) удаляется при каждом деплое,
    # перезапуске и засыпании сервиса (через 15 минут без запросов).
    plan: free

    # Чтобы данные сохранялись, нужен постоянный диск (только платные планы).
    # Раскомментируйте эти строки и строку TRAINER_PERSISTENT_DISK ниже:
    # plan: starter
    # disk:
    #   name: trainer-data
    #   mountPath: /srv/data
    #   sizeGB: 1

    envVars:
      # Сайт работает только по HTTPS — cookie тоже только по HTTPS.
      - key: TRAINER_COOKIE_SECURE
        value: "true"
      # - key: TRAINER_PERSISTENT_DISK
      #   value: "true"
