{# Результат проверки задания — в стиле Postman Test Results (PASS / FAIL).
   Считается в static/js/checker.js по ответу сервера. #}
<template x-if="validation">
  <div class="pm-results">
    <div class="pm-results-title">
      <b style="color: var(--pm-text)">Test Results</b>
      <span x-text="'(' + (validation?.results || []).filter(r => r.ok).length + '/' + (validation?.results || []).length + ')'"></span>
      <template x-if="validation?.total > 1">
        <span x-text="t('Выполнено шагов: {done} из {total}', {done: validation?.done, total: validation?.total})"></span>
      </template>
    </div>
    <template x-if="validation?.passed">
      <div class="pm-banner is-ok">
        <span aria-hidden="true">✓</span>
        <div><b>{{ _("Задание выполнено!") }}</b> {{ _("Сервер вернул именно то, что нужно. Можно переходить к следующему.") }}</div>
      </div>
    </template>
    <template x-if="validation && !validation.passed">
      <div class="pm-banner is-warn">
        <span aria-hidden="true">!</span>
        <div>
          <b x-text="validation?.waitingConsole ? t('Почти готово') : t('Пока не совсем так')"></b>
          <p class="pm-hint-text" x-show="validation?.hint" x-text="validation?.hint"></p>
        </div>
      </div>
    </template>
    <details class="pb-1" x-show="validation?.results?.length">
      <summary class="cursor-pointer text-xs" style="color: var(--pm-text-2)">{{ _("Что проверялось в ответе") }}</summary>
      <div class="mt-1">
        <template x-for="r in (validation?.results || [])" :key="r.path + r.op">
          <div class="pm-test">
            <span class="pm-badge" :class="r.ok ? 'pass' : 'fail'" x-text="r.ok ? 'PASS' : 'FAIL'"></span>
            <span>
              <code x-text="r.path"></code>
              <span x-text="{equals: '=', contains: t('содержит'), exists: r.expected ? t('есть') : t('нет'), in: t('одно из')}[r.op]"></span>
              <code x-show="r.op !== 'exists'" x-text="JSON.stringify(r.expected)"></code>
              <template x-if="!r.ok && r.op !== 'exists'">
                <span class="pm-fail">— <span x-show="r.found">{{ _("пришло") }} <code class="pm-fail" x-text="JSON.stringify(r.actual)"></code></span><span x-show="!r.found">{{ _("такого поля в ответе нет") }}</span></span>
              </template>
            </span>
          </div>
        </template>
      </div>
    </details>
  </div>
</template>
