{# Console — журнал запросов, как Postman Console. #}
<div>
  <p class="pm-section-title">{{ _("Журнал последних 10 запросов: что ушло на сервер и что пришло в ответ — «как есть».") }}</p>
  <template x-if="!log.length">
    <p class="pm-note">{{ _("Пока пусто. Отправь запрос.") }}</p>
  </template>
  <div class="max-h-80 overflow-auto rounded border border-[#e6e6e6]" x-show="log.length">
    <template x-for="(e, i) in log" :key="i + e.at">
      <div>
        <button type="button" class="pm-console-row" @click="openedLog = openedLog === i ? null : i">
          <span class="pm-caret" x-text="openedLog === i ? '▾' : '▸'"></span>
          <b :style="{ color: methodColor(e.request.method) }" x-text="e.request.method"></b>
          <span class="pm-url-cell" x-text="e.request.url"></span>
          <b :class="statusClass(e.response ? e.response.status : 0)" x-text="e.response ? e.response.status : '—'"></b>
          <span class="pm-time" x-show="e.timeMs !== undefined" x-text="e.timeMs + ' ms'"></span>
        </button>
        <div x-show="openedLog === i" class="pm-console-detail">
          <h4>▶ Request Headers</h4>
          <pre x-html="prettyHeaders(e.request.headers)"></pre>
          <h4>▶ Request Body</h4>
          <pre x-html="pretty(e.request.body)"></pre>
          <h4 x-show="e.response">◀ Response Headers</h4>
          <pre x-show="e.response" x-html="e.response ? prettyHeaders(Object.fromEntries(e.response.headers)) : ''"></pre>
          <h4 x-show="e.response">◀ Response Body</h4>
          <pre x-show="e.response" class="max-h-48 overflow-auto" x-html="e.response ? pretty(e.response.body) : ''"></pre>
        </div>
      </div>
    </template>
  </div>
</div>
