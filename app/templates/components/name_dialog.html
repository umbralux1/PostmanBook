{# Имя участника: спрашиваем при первом входе, меняется кликом по своему аватару. #}
<div x-data="nameDialog" x-show="open" x-cloak @edit-name.window="edit()"
     class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/40 p-4">
  <form @submit.prevent="save()" class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
    <h2 class="text-lg font-bold text-slate-900">{{ _("Как тебя зовут?") }}</h2>
    <p class="mt-1 text-sm text-slate-500">{{ _("Имя увидят участники комнаты рядом с твоим курсором.") }}</p>
    <input x-model="name" x-ref="input" maxlength="40" required
           class="mt-4 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
           placeholder="{{ _('Например, Аня') }}">
    <p x-show="error" class="mt-2 text-sm text-rose-600" x-text="error"></p>
    <div class="mt-4 flex justify-end gap-2">
      <button type="button" x-show="canClose()" @click="open = false" class="rounded-lg px-3 py-2 text-sm text-slate-500 hover:bg-slate-100">{{ _("Отмена") }}</button>
      <button class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">{{ _("Готово") }}</button>
    </div>
  </form>
</div>
