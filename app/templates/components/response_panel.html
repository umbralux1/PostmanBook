{# Панель ответа — как в Postman: вкладки Body / Headers, справа Status · Time · Size. #}
<div class="pm-response">
  <template x-if="!response">
    <div>
      <div class="pm-resp-head"><span class="pm-tab is-active">Response</span></div>
      <div class="pm-empty">
        <svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true">
          <rect x="1" y="1" width="54" height="38" rx="4" fill="#f9f9f9" stroke="#e6e6e6"/>
          <rect x="8" y="10" width="14" height="4" rx="2" fill="#ff6c37" opacity=".7"/>
          <rect x="8" y="19" width="40" height="3" rx="1.5" fill="#e6e6e6"/>
          <rect x="8" y="26" width="30" height="3" rx="1.5" fill="#e6e6e6"/>
        </svg>
        {{ _("Нажми Send, и здесь появится ответ сервера.") }}
      </div>
    </div>
  </template>
  <template x-if="response">
    <div>
      <div class="pm-resp-head">
        <button type="button" class="pm-tab" :class="respTab==='body' ? 'is-active' : ''" @click="respTab='body'">Body</button>
        <button type="button" class="pm-tab" :class="respTab==='headers' ? 'is-active' : ''" @click="respTab='headers'">
          Headers<span class="pm-count" x-text="'(' + response.headers.length + ')'"></span>
        </button>
        <div class="pm-resp-meta">
          <span>Status: <b class="pm-status" :class="statusClass(response.status)" x-text="response.status + ' ' + response.statusText"></b></span>
          <span>Time: <b class="pm-ok" x-text="response.timeMs + ' ms'"></b></span>
          <span>Size: <b class="pm-ok" x-text="formatSize(response.size)"></b></span>
        </div>
      </div>

      <div x-show="respTab==='body'">
        <div class="pm-resp-toolbar">
          <div class="pm-seg" role="group">
            <button type="button" :class="respView==='pretty' ? 'is-active' : ''" @click="respView='pretty'">Pretty</button>
            <button type="button" :class="respView==='raw' ? 'is-active' : ''" @click="respView='raw'">Raw</button>
          </div>
          <span class="pm-lang" x-show="response.json !== null && respView==='pretty'">JSON</span>
        </div>
        <div class="pm-viewer" :class="respView==='raw' ? 'is-raw' : ''">
          <template x-if="respView==='pretty'">
            <div class="pm-gutter" x-text="lineNumbers(prettyText(response.text))"></div>
          </template>
          <pre x-show="respView==='pretty'" x-html="pretty(response.text)"></pre>
          <pre x-show="respView==='raw'" x-text="response.text || ''"></pre>
        </div>
      </div>

      <div x-show="respTab==='headers'" class="pm-panel" style="min-height: 0">
        <table class="pm-kv">
          <thead><tr><th>Key</th><th>Value</th></tr></thead>
          <tbody>
            <template x-for="h in response.headers" :key="h[0]">
              <tr><td class="code-area" style="padding: 5px 8px" x-text="h[0]"></td><td class="code-area" style="padding: 5px 8px; word-break: break-all" x-text="h[1]"></td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>
</div>
