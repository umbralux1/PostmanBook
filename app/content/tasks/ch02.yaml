chapter_id: ch02
tasks:
  - id: ch02-task1
    order: 1
    title: "Первый POST с JSON"
    description_md: |
      Создай `POST`-запрос на `{{BASE_URL}}/api/echo`. В теле отправь JSON:

      ```json
      {
        "ticket_id": "123",
        "message": "Не работает кнопка сохранения",
        "priority": "high"
      }
      ```

      Не забудь заголовок `Content-Type: application/json`.

      **Как сделать:**

      1. Выбери метод `POST`, в адресе оставь только `{{BASE_URL}}/api/echo`
         (параметры из главы 1 можно удалить).
      2. Вкладка **Body** → переключатель **raw JSON** → вставь JSON выше.
         Под полем должно появиться зелёное «JSON корректный».
      3. Вкладка **Headers** → в пустой строке Key `Content-Type`,
         Value `application/json`.
      4. Нажми **Send**.

      **Что должно быть:**
      - статус `200`;
      - в ответе есть блок `json` с твоими данными;
      - в блоке `headers` ответа есть `content-type: application/json`.

      Помни: это echo-сервер. `200` здесь значит «получил вот это», а не
      «заявка создана» — он ничего не сохраняет.

      **Ответь себе:** почему для `POST` понадобилось тело, а для `GET` — нет?

      <details markdown="1">
      <summary>Проверь себя</summary>

      `GET` только просит данные — передавать серверу нечего, все уточнения
      помещаются в параметры адреса. `POST` отправляет данные, которые сервер
      должен принять (например, текст новой заявки), и для них нужно место —
      тело. А заголовок `Content-Type` подсказывает серверу, что тело
      записано в формате JSON.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес ({{BASE_URL}}/api/echo) и что в JSON нет ошибок — кавычки и запятые."}
        - {path: body.method, equals: POST, hint: "Создание — это всегда POST, не GET."}
        - {path: body.headers.content-type, contains: application/json, hint: "Сервер не знает, что тело — JSON: добавь заголовок Content-Type: application/json."}
        - {path: body.json, exists: true, hint: "Сервер не получил JSON. Во вкладке Body выбери raw JSON и вставь тело из задания."}
        - {path: body.json.ticket_id, equals: "123", hint: "ticket_id должен быть строкой \"123\" — в двойных кавычках."}
        - {path: body.json.message, exists: true, hint: "В теле не хватает поля message."}
        - {path: body.json.priority, in: [low, medium, high], hint: "priority должен быть одним из: \"low\", \"medium\", \"high\"."}

  - id: ch02-task2
    order: 3
    title: "Заголовки"
    description_md: |
      В том же `POST`-запросе открой вкладку **Headers** и добавь:

      - **Key:** `X-Debug-Source`
      - **Value:** `support-training`

      **Как сделать:** `Content-Type` из прошлого задания не удаляй — новый
      заголовок впиши в следующую пустую строку. Тело тоже оставь как было.
      Нажми **Send**.

      **Что должно быть:** в блоке `headers` ответа ты видишь
      `x-debug-source: support-training` (сервер записывает названия
      заголовков маленькими буквами — для HTTP это одно и то же).

      **Ответь себе:** зачем нужны заголовки, если уже есть URL и тело?

      <details markdown="1">
      <summary>Проверь себя</summary>

      URL говорит, *куда* идёт запрос, тело — *что* в нём лежит. Заголовки
      описывают сам запрос: в каком формате тело (`Content-Type`), кто
      отправляет (`Authorization`), какой ответ хотим получить (`Accept`).
      Их удобно держать отдельно: сервер читает их до тела и по ним решает,
      как обработать запрос — или сразу отказать (например, `401` без токена).

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес ({{BASE_URL}}/api/echo) и JSON в теле."}
        - {path: body.method, equals: POST, hint: "Нужен POST-запрос из задания 1."}
        - {path: body.headers.content-type, contains: application/json, hint: "Не удаляй заголовок Content-Type: application/json из задания 1."}
        - {path: body.headers.x-debug-source, equals: support-training, hint: "В headers ответа нет x-debug-source: support-training. Добавь заголовок во вкладке Headers."}
        - {path: body.json, exists: true, hint: "Оставь тело из задания 1."}

  - id: ch02-task3
    order: 5
    title: "Статус-коды вживую"
    description_md: |
      Отправь три `GET`-запроса и запиши в блокнот результат каждого:

      1. `GET {{BASE_URL}}/api/status/200`
      2. `GET {{BASE_URL}}/api/status/404`
      3. `GET {{BASE_URL}}/api/status/500`

      **Как сделать:** выбери метод `GET`, во вкладке **Body** выбери `none`.
      Впиши первый адрес, нажми **Send**, потом поменяй число в адресе и
      отправь снова. Задание засчитается, когда будут отправлены все три.

      Для каждого определи:
      - статус-код;
      - группу (`2xx`, `4xx`, `5xx`);
      - что это значит для поддержки.

      <details markdown="1">
      <summary>Проверь себя</summary>

      - `200` — группа `2xx`, успех, всё в порядке.
      - `404` — группа `4xx`, неверный URL или объекта нет: проверяем адрес
        и параметры у себя.
      - `500` — группа `5xx`, проблема на сервере: собираем детали (метод,
        URL, время, тело запроса и ответа) и эскалируем.

      </details>
    # Три ответа в любом порядке.
    expected:
      steps:
        - - {path: status, equals: 200, hint: "Отправь GET на {{BASE_URL}}/api/status/200."}
          - {path: body.status, equals: 200, hint: "Отправь GET на {{BASE_URL}}/api/status/200."}
        - - {path: status, equals: 404, hint: "Теперь отправь GET на {{BASE_URL}}/api/status/404."}
          - {path: body.status, equals: 404, hint: "Адрес должен быть именно {{BASE_URL}}/api/status/404."}
        - - {path: status, equals: 500, hint: "Теперь отправь GET на {{BASE_URL}}/api/status/500."}
          - {path: body.status, equals: 500, hint: "Адрес должен быть именно {{BASE_URL}}/api/status/500."}

  - id: ch02-task4
    order: 7
    title: "Console"
    description_md: |
      Отправь `POST`-запрос из задания 1 ещё раз, затем открой **Console**
      (кнопка в нижней строке мини-Postman) и найди там:

      - метод запроса;
      - полный URL;
      - заголовки запроса (включая `Content-Type`);
      - тело запроса;
      - статус ответа;
      - тело ответа.

      **Как сделать:** собери POST из задания 1 (метод, тело, `Content-Type`),
      нажми **Send**, потом нажми **Console** в нижней строке мини-Postman —
      под ответом откроется журнал. Если он уже открыт, нажимать не нужно: новый
      запрос сразу появится в нём. Верхняя строка журнала — последний запрос, она
      уже раскрыта; нажатие на строку сворачивает и разворачивает её. Значками ▶ отмечено то, что ушло на сервер,
      значками ◀ — то, что пришло обратно.

      **Что должно быть:** ты можешь показать пальцем, где в консоли видно
      `Content-Type: application/json` и твой отправленный JSON.

      **Ответь себе:** почему Console важнее, чем просто «посмотреть на панель ответа»?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Панель ответа показывает только ответ. Console показывает **обе
      стороны**: что именно ушло на сервер и что пришло назад. Если ошибка в
      самом запросе (забыли заголовок, опечатка в адресе, сломанное тело),
      увидеть это можно только в Console. Плюс там хранится история —
      можно сравнить удачный запрос с неудачным.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес ({{BASE_URL}}/api/echo) и JSON в теле."}
        - {path: body.method, equals: POST, hint: "Нужен POST-запрос из задания 1."}
        - {path: body.headers.content-type, contains: application/json, hint: "Добавь заголовок Content-Type: application/json."}
        - {path: body.json, exists: true, hint: "Добавь JSON-тело из задания 1."}
      require_console: true
      console_hint: "Ответ правильный. Теперь нажми Console в нижней строке мини-Postman и найди там этот запрос."

  - id: ch02-task5
    order: 8
    title: "Мини-тикет"
    description_md: |
      Пользователь пишет:

      > «Отправляю заявку через `POST /tickets`, но получаю `400 Bad Request`.
      > Вот тело: `{"title": "Ошибка", "priority": high}`. Что не так?»

      **Что сделать:**

      1. Воспроизведи похожий запрос на `{{BASE_URL}}/api/echo` методом `POST` с
         заголовком `Content-Type: application/json`.
      2. Отправь тело **ровно как у пользователя**: `high` без кавычек.
         Мини-Postman подсветит ошибку JSON — так и задумано, всё равно
         нажми **Send**.
      3. Посмотри, что вернёт сервер и что покажет Console.
      4. Исправь тело так, чтобы стало валидно, и отправь снова.

      **Что должно быть:**
      - первый запрос падает с ошибкой (`400`);
      - второй — проходит с `200`;
      - ты можешь объяснить, что именно было сломано.

      **Сформулируй ответ пользователю** в 2–3 предложениях, потом сравни
      с примером.

      <details markdown="1">
      <summary>Пример ответа</summary>

      > «В теле запроса значение `priority` указано без кавычек, из-за этого
      > JSON невалиден и сервер возвращает `400 Bad Request`. Нужно отправлять
      > так: `"priority": "high"`.»

      Почему так: `high` — это не число, не `true`/`false` и не `null`, значит
      это должна быть строка, а строки в JSON всегда в двойных кавычках.

      </details>
    # Два ответа по порядку: сначала ошибка 400, потом успех.
    expected:
      ordered: true
      steps:
        - - {path: status, equals: 400, hint: "Сначала воспроизведи ошибку: тело ровно как у пользователя (high без кавычек) и заголовок Content-Type: application/json. Сервер должен ответить 400."}
          - {path: body.error, equals: invalid_json, hint: "Сервер должен ответить ошибкой invalid_json — отправь тело ровно как у пользователя."}
        - - {path: status, equals: 200, hint: "Теперь исправь JSON: priority должен быть строкой в кавычках — \"high\"."}
          - {path: body.json.title, exists: true, hint: "Не потеряй поле title."}
          - {path: body.json.priority, equals: high, hint: "priority должен быть строкой \"high\"."}

  - id: ch02-task6
    order: 2
    title: "Типы значений в JSON"
    description_md: |
      Отправь `POST`-запрос на `{{BASE_URL}}/api/echo` с заголовком
      `Content-Type: application/json` и телом из раздела 2.3:

      ```json
      {
        "ticket_id": "123",
        "status": "open",
        "priority": 2,
        "urgent": true,
        "tags": ["billing", "mobile"]
      }
      ```

      Следи за кавычками: в этом теле есть строки, число, значение «да/нет»
      и список.

      **Как сделать:** метод и заголовок — как в задании 1. Во вкладке **Body**
      (**raw JSON**) замени тело на JSON выше и нажми **Send**.

      **Что должно быть:** в блоке `json` ответа те же значения тех же типов:
      `"123"` в кавычках, `2` и `true` без кавычек, `tags` — список.

      **Ответь себе:** для каждого поля назови его тип. Чем `"ticket_id": "123"`
      отличается от `"ticket_id": 123`?

      <details markdown="1">
      <summary>Проверь себя</summary>

      - `ticket_id` — строка (цифры в кавычках);
      - `status` — строка;
      - `priority` — число (без кавычек);
      - `urgent` — да/нет (`true` без кавычек);
      - `tags` — список из двух строк.

      `"123"` — строка, текст из цифр, а `123` — число. Для сервера это разные
      значения: если он ждёт строку, а пришло число, он может ответить ошибкой.
      Так же `"true"` в кавычках — это уже не «да», а строка из четырёх букв.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес ({{BASE_URL}}/api/echo) и что в JSON нет ошибок — кавычки и запятые."}
        - {path: body.method, equals: POST, hint: "Нужен метод POST, как в задании 1."}
        - {path: body.headers.content-type, contains: application/json, hint: "Добавь заголовок Content-Type: application/json."}
        - {path: body.json, exists: true, hint: "Сервер не получил JSON. Во вкладке Body выбери raw JSON и вставь тело из задания."}
        - {path: body.json.ticket_id, equals: "123", hint: "ticket_id — строка: \"123\" в двойных кавычках."}
        - {path: body.json.status, equals: open, hint: "status — строка \"open\" в двойных кавычках."}
        - {path: body.json.priority, equals: 2, hint: "priority — число: 2 без кавычек. \"2\" в кавычках — уже строка."}
        - {path: body.json.urgent, equals: true, hint: "urgent — значение «да»: true без кавычек и маленькими буквами."}
        - {path: body.json.tags, equals: [billing, mobile], hint: "tags — список в квадратных скобках: [\"billing\", \"mobile\"]."}

  - id: ch02-task7
    order: 4
    title: "Accept и Authorization"
    description_md: |
      В том же `POST`-запросе добавь во вкладке **Headers** ещё два заголовка
      из раздела 2.4:

      - `Accept: application/json` — «ответ хочу в JSON»;
      - `Authorization: Bearer test-token-123` — «пропуск». Это учебный токен,
        не настоящий.

      **Как сделать:** прежние заголовки и тело не удаляй, новые впиши в
      следующие пустые строки. Нажми **Send**, потом открой **Console**.

      **Что должно быть:**
      - в блоке `headers` ответа есть `accept: application/json`;
      - там же есть `authorization`, но вместо токена — `***`;
      - в Console у отправленного запроса токен виден целиком.

      **Ответь себе:** почему echo спрятал токен в ответе? Что это значит для
      скриншотов Console, которые ты отправляешь коллегам?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Токен — ключ от аккаунта (раздел 2.5). Учебный сервер получил его, но не
      показывает в ответе, а заменяет на `***` — так же стоит поступать и тебе.

      Console показывает запрос таким, каким он ушёл, — вместе с настоящим
      токеном. Поэтому перед тем как отправить скриншот Console или текст
      запроса в тикет или чат, замени токен на `***`.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес ({{BASE_URL}}/api/echo) и JSON в теле."}
        - {path: body.method, equals: POST, hint: "Нужен POST-запрос из прошлых заданий."}
        - {path: body.headers.content-type, contains: application/json, hint: "Не удаляй заголовок Content-Type: application/json."}
        - {path: body.headers.accept, equals: application/json, hint: "В headers ответа нет accept: application/json. Добавь заголовок Accept со значением application/json."}
        - {path: body.headers.authorization, exists: true, hint: "В headers ответа нет authorization. Добавь заголовок Authorization со значением Bearer test-token-123."}
      require_console: true
      console_hint: "Заголовки дошли. Теперь нажми Console в нижней строке мини-Postman и найди в запросе Authorization."

  - id: ch02-task8
    order: 6
    title: "Коды, которые надо знать наизусть"
    description_md: |
      В задании 5 были `200`, `404` и `500`. Посмотри на остальные коды из
      раздела 2.2. Отправь четыре `GET`-запроса:

      1. `GET {{BASE_URL}}/api/status/201`
      2. `GET {{BASE_URL}}/api/status/401`
      3. `GET {{BASE_URL}}/api/status/403`
      4. `GET {{BASE_URL}}/api/status/503`

      **Как сделать:** как в задании 5 — метод `GET`, **Body** `none`, меняй
      число в адресе и жми **Send**. Задание засчитается, когда будут
      отправлены все четыре.

      Для каждого кода определи:
      - группу (`2xx`, `4xx`, `5xx`);
      - что делает поддержка: всё хорошо, проверяем у себя или эскалируем.

      **Ответь себе:** пользователь получил `403`. Поможет ли ему войти
      в аккаунт заново?

      <details markdown="1">
      <summary>Проверь себя</summary>

      - `201` — `2xx`, объект создан, всё хорошо.
      - `401` — `4xx`, сервер не знает, кто ты: токена нет, он неверный или
        просрочен. Проверяем токен.
      - `403` — `4xx`, сервер знает, кто ты, но этому пользователю действие
        запрещено. Проверяем права пользователя.
      - `503` — `5xx`, сервис недоступен. Собираем детали и эскалируем.

      Новый вход даст новый токен — это помогает при `401`. При `403` токен
      в порядке, дело в правах, поэтому повторный вход не поможет.

      </details>
    # Четыре ответа в любом порядке.
    expected:
      steps:
        - - {path: status, equals: 201, hint: "Отправь GET на {{BASE_URL}}/api/status/201."}
          - {path: body.status, equals: 201, hint: "Отправь GET на {{BASE_URL}}/api/status/201."}
        - - {path: status, equals: 401, hint: "Теперь отправь GET на {{BASE_URL}}/api/status/401."}
          - {path: body.status, equals: 401, hint: "Адрес должен быть именно {{BASE_URL}}/api/status/401."}
        - - {path: status, equals: 403, hint: "Теперь отправь GET на {{BASE_URL}}/api/status/403."}
          - {path: body.status, equals: 403, hint: "Адрес должен быть именно {{BASE_URL}}/api/status/403."}
        - - {path: status, equals: 503, hint: "Теперь отправь GET на {{BASE_URL}}/api/status/503."}
          - {path: body.status, equals: 503, hint: "Адрес должен быть именно {{BASE_URL}}/api/status/503."}

  - id: ch02-task9
    order: 9
    title: "Мини-тикет: две ошибки в JSON"
    description_md: |
      Пользователь пишет:

      > «Создаю заявку, а сервер отвечает `400 Bad Request`. Вот тело:
      > `{'title': 'Не могу войти', 'priority': 'high',}`. Что не так?»

      **Что сделать:**

      1. Отправь `POST` на `{{BASE_URL}}/api/echo` с заголовком
         `Content-Type: application/json` и телом **ровно как у пользователя**.
         Мини-Postman подсветит ошибку JSON — всё равно нажми **Send**.
      2. Найди в теле **все** ошибки (их две), исправь и отправь снова.

      **Что должно быть:**
      - первый запрос падает с `400`;
      - второй проходит с `200`, в блоке `json` есть `title` и `priority`.

      **Сформулируй ответ пользователю** в 2–3 предложениях, потом сравни
      с примером.

      <details markdown="1">
      <summary>Пример ответа</summary>

      > «В теле запроса две ошибки, из-за них JSON невалиден и сервер отвечает
      > `400 Bad Request`: ключи и строки записаны в одинарных кавычках, а после
      > последней пары стоит лишняя запятая. Правильно так:
      > `{"title": "Не могу войти", "priority": "high"}`.»

      Если исправить только одну ошибку, JSON всё равно останется невалидным —
      поэтому важно найти все.

      </details>
    # Два ответа по порядку: сначала ошибка 400, потом успех.
    expected:
      ordered: true
      steps:
