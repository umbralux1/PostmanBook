chapter_id: ch01
tasks:
  - id: ch01-task1
    order: 1
    title: "Первый GET-запрос"
    description_md: |
      Сделай запрос к `{{BASE_URL}}/api/echo` методом `GET` с query-параметрами
      `source=postman` и `user=student`.

      **Как сделать:**

      1. Нажми «Решать» на этой карточке.
      2. В мини-Postman слева от адреса выбери метод `GET`.
      3. В строку адреса впиши: `{{BASE_URL}}/api/echo?source=postman&user=student`
         (знак `?` начинает параметры, `&` разделяет их).
      4. Нажми **Send**.

      **Что должно быть на экране:**
      - статус-код `200`;
      - в теле ответа блок `args` с твоими параметрами:
        `"source": "postman"` и `"user": "student"`.

      **Ответь себе:** почему параметры `source` и `user` попали в `args`,
      а не в тело запроса?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Потому что они записаны **в адресе** после `?` — это query-параметры.
      Echo-сервер складывает параметры из адреса в `args`. Тела у этого
      запроса нет вообще: `GET` только просит данные и ничего не передаёт
      в теле.

      </details>
    # Echo возвращает то, что получил, поэтому правильный запрос = вот такой ответ.
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес: запрос должен идти на {{BASE_URL}}/api/echo."}
        - {path: body.method, equals: GET, hint: "Это чтение данных — нужен метод GET, не POST."}
        - {path: body.path, equals: /api/echo, hint: "Запрос должен идти на {{BASE_URL}}/api/echo."}
        - {path: body.args.source, equals: postman, hint: "В args нет source=postman. Параметры пишутся после ? и разделяются & — второй ? ломает адрес."}
        - {path: body.args.user, equals: student, hint: "В ответе нет user=student в args. Второй параметр добавляется через &: ?source=postman&user=student"}

  - id: ch01-task2
    order: 2
    title: "Параметры через вкладку Params"
    description_md: |
      В том же запросе добавь через вкладку **Params** ещё два параметра:
      `ticket_id=123` и `status=open`.

      **Как сделать:**

      1. Оставь адрес из задания 1 (`{{BASE_URL}}/api/echo?source=postman&user=student`).
      2. Открой вкладку **Params** — там уже видны `source` и `user`.
      3. В пустой строке впиши Key `ticket_id` и Value `123`, в следующей —
         `status` и `open`.
      4. Посмотри на строку адреса: параметры добавились туда сами.
      5. Нажми **Send**.

      **Что должно быть:**
      - параметры появились в URL после `?`;
      - в ответе они тоже в блоке `args`.

      **Ответь себе:** чем query-параметр отличается от тела запроса?
      Когда нужен один, а когда другое?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Вкладка Params и строка адреса — это одно и то же, просто в двух видах:
      таблица удобнее, когда параметров много.

      Query-параметры — часть адреса: короткие уточнения и фильтры
      («покажи заявку 123», «только открытые»). Тело — отдельная часть
      запроса для данных, которые нужно передать и сохранить (текст заявки,
      профиль). Фильтруем — параметрами, создаём и меняем — телом.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес: запрос должен идти на {{BASE_URL}}/api/echo."}
        - {path: body.method, equals: GET, hint: "Нужен метод GET."}
        - {path: body.args.source, equals: postman, hint: "Пропал параметр source=postman из задания 1 — верни его."}
        - {path: body.args.user, equals: student, hint: "Пропал параметр user=student из задания 1 — верни его."}
        - {path: body.args.ticket_id, equals: "123", hint: "В args нет ticket_id=123. Добавь его во вкладке Params."}
        - {path: body.args.status, equals: open, hint: "В args нет status=open. Добавь его во вкладке Params."}
