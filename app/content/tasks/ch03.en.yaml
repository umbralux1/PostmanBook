chapter_id: ch03
tasks:
  - id: ch03-task1
    order: 1
    phase: 2
    title: "Connection check"
    description_md: |
      Send your first request from the real Postman.

      **How to do it:**

      1. In Postman click **+** (a new request tab). Method `GET`, address
         `{{BASE_URL}}/api/echo`.
      2. The **Headers** tab → add two rows (the values are in the “Your Postman” panel
         on the right, the “Copy” button):
          - Key `X-Student-Id`, Value — your personal code;
          - Key `X-Task-Code`, Value `ch03-task1`.
      3. Click **Send**.

      **What you should get:**
      - in Postman — status `200` and the echo server's response;
      - in the “Your Postman” panel on the right — your request in the log, the task done.

      The request didn't show up in the log? Check that the header key is spelled
      correctly (`X-Student-Id`) and the value is your whole code.
    expected:
      request: {method: GET, path: /api/echo}
      response:
        - {path: status, equals: 200, hint: "The server didn't answer 200. Check the address: {{BASE_URL}}/api/echo."}
        - {path: body.path, equals: /api/echo, hint: "The request went to the wrong address — you need {{BASE_URL}}/api/echo."}
        - {path: body.method, equals: GET, hint: "The method must be GET — pick it to the left of the address."}

  - id: ch03-task2
    order: 2
    phase: 2
    title: "Ticket list"
    description_md: |
      See which tickets you have. Every student has their own practice set — it's created
      on the first request with your `X-Student-Id`.

      **How to do it:** `GET {{BASE_URL}}/api/tickets` with the `X-Student-Id` and
      `X-Task-Code: ch03-task2` headers.

      **What you should get:**
      - status `200`;
      - the body has `items` (the tickets on this page), `page`, `limit`, `total`, `pages`.

      **Ask yourself:** how many tickets are there in all (`total`) and how many are shown
      on this page? Why don't they match?

      <details markdown="1">
      <summary>Check yourself</summary>

      There are 23 tickets in all, but 10 on the page: the server returns the list in
      pages, `limit=10` by default. The rest are on pages 2 and 3 (`pages: 3`). More in
      section 3.6.

      </details>
    expected:
      request: {method: GET, path: /api/tickets}
      response:
        - {path: status, equals: 200, hint: "The server didn't answer 200. Check the address: {{BASE_URL}}/api/tickets."}
        - {path: body.items, exists: true, hint: "There is no items list in the response — the request didn't go to {{BASE_URL}}/api/tickets."}
        - {path: body.total, exists: true, hint: "There is no total in the response — the request didn't go to {{BASE_URL}}/api/tickets."}
        - {path: body.page, exists: true, hint: "There is no page number in the response — you need the list at {{BASE_URL}}/api/tickets."}

  - id: ch03-task3
    order: 3
    phase: 2
    title: "Create a ticket"
    description_md: |
      Create a new ticket.

      **How to do it:**

      1. Method `POST`, address `{{BASE_URL}}/api/tickets`.
      2. **Headers:** `X-Student-Id`, `X-Task-Code: ch03-task3` and
         `Content-Type: application/json`.
      3. **Body** → **raw** → pick **JSON** on the right and paste:

         ```json
         {"title": "Test ticket", "priority": "medium"}
         ```

      4. **Send.**

      **What you should get:**
      - status `201 Created`;
      - the body is the new ticket with an `id` and `status: "open"`;
      - the response **Headers** tab has `X-Request-ID`.

      Remember the new ticket's `id` — you'll need it in task 5.

      **Ask yourself:** what happens if you click **Send** again?

      <details markdown="1">
      <summary>Check yourself</summary>

      A second identical ticket appears with a new `id`: `POST` is not idempotent
      (section 3.3). That's how duplicates appear when a customer clicks a button twice.

      </details>
    expected:
      request:
        method: POST
        path: /api/tickets
        headers: {Content-Type: application/json}
      response:
        - {path: status, equals: 201, hint: "The ticket wasn't created. Check the method (POST), the address ({{BASE_URL}}/api/tickets), the Content-Type: application/json header and the JSON body. The server's response will tell you what's wrong."}
        - {path: body.id, exists: true, hint: "The response has no id of the new ticket."}
        - {path: body.status, equals: open, hint: "A new ticket must be open — don't send status in the body."}
        - {path: headers.x-request-id, exists: true, hint: "The response headers have no X-Request-ID."}

  - id: ch03-task4
    order: 4
    phase: 2
    title: "PATCH or PUT"
    description_md: |
      Take the ticket **“Cannot log in to my account”** into work: change its status to
      `in_progress` and leave the other fields — title, priority, description — alone.

      **How to do it:**

      1. Find the ticket's `id`: `GET {{BASE_URL}}/api/tickets` (it's first in the list).
      2. Send `PATCH {{BASE_URL}}/api/tickets/<id>` with the `X-Student-Id`,
         `X-Task-Code: ch03-task4` and `Content-Type: application/json` headers and the
         body `{"status": "in_progress"}`.

      **What you should get:**
      - status `200`;
      - `status: "in_progress"`, while `title`, `priority` and `description` stay the same.

      **Ask yourself:** what would happen with the same body but the `PUT` method?

      <details markdown="1">
      <summary>Check yourself</summary>

      `PUT` replaces the whole ticket, so the server would answer `422`: the required
      `title` and `priority` are missing. And a `PUT` with `title` and `priority` but
      without `description` wipes the description. Hence tickets like “the description
      disappeared after saving”.

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "The server didn't answer 200. You need a PATCH to {{BASE_URL}}/api/tickets/<id> with Content-Type: application/json. If you got 422, it looks like a PUT: it requires the whole ticket."}
        - {path: body.title, equals: "Cannot log in to my account", hint: "That's not the right ticket. Find the id of “Cannot log in to my account” in the GET {{BASE_URL}}/api/tickets list."}
        - {path: body.status, equals: in_progress, hint: "The status must become in_progress. Body: {\"status\": \"in_progress\"}."}
        - {path: body.priority, equals: high, hint: "The priority changed, but it shouldn't be touched. Get the ticket set back (POST {{BASE_URL}}/api/tickets/reset) and send only status in the PATCH."}
        - {path: body.description, equals: "Says 'Wrong password', but it is correct.", hint: "The description disappeared or changed — looks like a PUT: it replaces the whole ticket. Get the ticket set back (POST {{BASE_URL}}/api/tickets/reset) and send a PATCH with status only."}

  - id: ch03-task5
    order: 5
    phase: 2
    title: "Delete and check"
    description_md: |
      Delete the “Test ticket” created in task 3 and make sure it's gone.

      **How to do it** (headers `X-Student-Id` and `X-Task-Code: ch03-task5`):

      1. `DELETE {{BASE_URL}}/api/tickets/<id>` — the `id` of the ticket from task 3
         (forgot it? find it at the end of the list, on the last page: `?page=3`).
      2. Send a `GET` to the same address.

      **What you should get:**
      - `DELETE` → `204 No Content`, the body is empty — that's normal;
      - then `GET` of the same address → `404 Not Found`.

      **Ask yourself:** what will a second `DELETE` of the same ticket return? Does it
      break idempotency?

      <details markdown="1">
      <summary>Check yourself</summary>

      `404`: the ticket is already gone. Idempotency isn't broken — the repeat deleted
      nothing new, the data is in the same state as after the first `DELETE`.

      </details>
    expected:
      ordered: true
      steps:
        - - {path: status, equals: 204, hint: "Delete the ticket first: DELETE {{BASE_URL}}/api/tickets/<id>. The server should answer 204."}
        - - {path: status, equals: 404, hint: "Now check: a GET of the same address {{BASE_URL}}/api/tickets/<id> should answer 404."}
          - {path: body.error, equals: not_found, hint: "You need a GET of the same ticket you deleted: the server should answer not_found."}

  - id: ch03-task6
    order: 6
    phase: 2
    title: "Conflict"
    description_md: |
      A customer writes: “I want to raise the priority of my question **“How do I change
      my email?”**, but the server returns an error.” Reproduce it.

      **How to do it:**

      1. Find the `id` of the ticket “How do I change my email?” in the list.
      2. `PATCH {{BASE_URL}}/api/tickets/<id>` with the `X-Student-Id`,
         `X-Task-Code: ch03-task6` and `Content-Type: application/json` headers and the
         body `{"priority": "high"}`.

      **What you should get:** `409 Conflict`, with `error: "ticket_closed"` in the body.
      Read the `message`.

      **Ask yourself:** who is at fault — the customer or the server? What do you tell
      the customer?

      <details markdown="1">
      <summary>Check yourself</summary>

      Nobody “broke” anything: the request is correct, but the ticket is closed and a
      closed ticket can't be changed. That's a `409`, a conflict with the state of the
      data. Answer: “The request is closed. It has to be reopened first
      (`PATCH {"status": "open"}`), then the priority can be changed.”

      </details>
    expected:
      response:
        - {path: status, equals: 409, hint: "409 Conflict is expected. Change the closed ticket “How do I change my email?” — find its id in the list. If you got 404, the id is wrong."}
        - {path: body.error, equals: ticket_closed, hint: "The error should be ticket_closed — change exactly the closed ticket."}

  - id: ch03-task7
    order: 7
    phase: 2
    title: "The “invisible” ticket"
    description_md: |
      A customer writes: “I created a request **“SMS code not received”**, but it's not in
      the list! Did you lose it?”

      **How to do it** (headers `X-Student-Id` and `X-Task-Code: ch03-task7`):
      `GET {{BASE_URL}}/api/tickets`, and in the **Params** tab add `page` = `2`.

      **What you should get:** status `200`, the ticket “SMS code not received” in `items`.

      **Ask yourself:** what do you tell the customer?

      <details markdown="1">
      <summary>Sample answer</summary>

      > “Your request is safe — it's on the second page of the list. Scroll down the
      > list or click “Next”.”

      </details>
    expected:
      request:
        method: GET
        path: /api/tickets
        query: {page: 2}
      response:
        - {path: status, equals: 200, hint: "The server didn't answer 200. You need GET {{BASE_URL}}/api/tickets?page=2."}
        - {path: body.page, equals: 2, hint: "This isn't the second page. Add the parameter page = 2 in Params."}
        - {path: body.items, contains: {title: "SMS code not received"}, hint: "The ticket “SMS code not received” isn't on this page. Check limit: with limit=10 it's on page 2. Deleted tickets from the set? Get it back: POST {{BASE_URL}}/api/tickets/reset."}

  - id: ch03-task8
    order: 8
    phase: 2
    title: "Too often"
    description_md: |
      The training endpoint `{{BASE_URL}}/api/limited` allows 3 requests per 10 seconds.

      **How to do it** (headers `X-Student-Id` and `X-Task-Code: ch03-task8`):

      1. Send `GET {{BASE_URL}}/api/limited` several times in a row until you get
         `429 Too Many Requests`.
      2. Find the `Retry-After` header in the response **Headers** tab — in how many
         seconds you can try again.
      3. Wait that long and send the request again.

      **What you should get:** first `429` with the `Retry-After` header, then `200`.

      **Write an answer to a customer** who says “the app shows error 429”.

      <details markdown="1">
      <summary>Sample answer</summary>

      > “The error means there were too many requests in a short time — this protects the
      > server, your data is fine. Please wait a few seconds and try again.”

      </details>
    expected:
      ordered: true
      steps:
        - - {path: status, equals: 429, hint: "Get a 429 first: send GET {{BASE_URL}}/api/limited several times in a row (more than 3 in 10 seconds)."}
          - {path: headers.retry-after, exists: true, hint: "The 429 response should have a Retry-After header."}
        - - {path: status, equals: 200, hint: "Wait as many seconds as Retry-After says and send the request again — you need a 200."}
          - {path: body.ok, equals: true, hint: "Repeat the request exactly to {{BASE_URL}}/api/limited."}

  - id: ch03-task9
    order: 9
    phase: 2
    title: "Mini-ticket: 422"
    description_md: |
      An integration developer writes:

      > “I'm taking the ticket “Promo code does not work” into work, sending
      > `PUT /api/tickets/<id>` with the body
      > `{"title": "Promo code does not work", "status": "in_progress"}`
      > and getting `422`. What's wrong?”

      **What to do** (headers `X-Student-Id`, `X-Task-Code: ch03-task9`,
      `Content-Type: application/json`):

      1. Find the `id` of the ticket “Promo code does not work”.
      2. Send the `PUT` **exactly like the developer** and get a `422`.
      3. Use the response body (`details`) to find what's missing, fix it and send again.

      **What you should get:** first `422`, then `200` — the ticket is `in_progress`.

      **Write an answer to the developer** in 1–2 sentences.

      <details markdown="1">
      <summary>Sample answer</summary>

      > “`PUT` replaces the whole ticket, so the body needs all required fields —
      > `priority` is missing (see `details.missing` in the response). Add it or use
      > `PATCH`, which changes only the fields you send.”

      </details>
    expected:
      ordered: true
      steps:
        - - {path: status, equals: 422, hint: "Reproduce the error first: a PUT with the body exactly like the developer's (without priority). The server should answer 422."}
          - {path: body.details.missing, contains: priority, hint: "The 422 should be about the missing priority field — send the body exactly like the developer's."}
        - - {path: status, equals: 200, hint: "Add the missing field to the body (see details.missing in the 422 response) and send the PUT again."}
          - {path: body.title, equals: "Promo code does not work", hint: "That's not the right ticket — you need “Promo code does not work”, with the title in the body unchanged."}
          - {path: body.status, equals: in_progress, hint: "The ticket should move to in_progress — keep status in the body."}

  - id: ch03-task10
    order: 10
    phase: 2
    title: "Mini-ticket: 503 and escalation"
    description_md: |
      A customer writes: “I open the orders section and get ‘Service temporarily
      unavailable’. What's wrong with my account?” Reproduce the error and collect the
      data for an escalation.

      **How to do it** (headers `X-Student-Id` and `X-Task-Code: ch03-task10`):

      1. `GET {{BASE_URL}}/api/status/503` — a training address that always answers
         `503 Service Unavailable`.
      2. In the response **Headers** tab, find `X-Request-ID`. The response body has the
         same value in the `request_id` field — compare them.

      **What you should get:** status `503`, `request_id` in the body, `X-Request-ID` in
      the response headers.

      **Ask yourself:** whose fault is it — the customer's or the server's? What do you
      tell the customer, and what do you send to the developers?

      <details markdown="1">
      <summary>Check yourself</summary>

      The customer isn't at fault: `5xx` is a server-side problem, and fixing the request
      won't help. To the customer: “It's a failure on our side, we've already passed it
      to the developers. Please try again a bit later — your data is safe.”

      Escalation to the developers:

      > `GET /api/status/503` → `503 Service Unavailable`, time: 14:32 (UTC+3),
      > X-Request-ID: `3f2c…` (full value from the header), response body attached.

      Never put tokens or passwords in an escalation (section 3.5).

      </details>
    expected:
      request: {method: GET, path: /api/status/503}
      response:
        - {path: status, equals: 503, hint: "A 503 response is needed. Send GET {{BASE_URL}}/api/status/503."}
        - {path: body.status, equals: 503, hint: "The request went to the wrong address — you need {{BASE_URL}}/api/status/503."}
        - {path: body.request_id, exists: true, hint: "The 503 response body should have a request_id field."}
        - {path: headers.x-request-id, exists: true, hint: "There's no X-Request-ID in the response headers."}
