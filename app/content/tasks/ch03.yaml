chapter_id: ch03
# Фаза 2: запросы — из настоящего Postman с заголовком X-Student-Id; задание — то, что
# выбрано на странице главы (заголовка с кодом задания нет).
# Проверка — тем же checker.js по ответам из журнала ученика (expected как в фазе 1).
# expected.request — эталон запроса для подсказок в журнале (validator.py), не для зачёта.
# Тикеты учебного набора (services/ticket_seed.py) — на английском, одни для RU/EN.
tasks:
  - id: ch03-task1
    order: 1
    phase: 2
    title: "Проверка связи"
    description_md: |
      Отправь первый запрос из настоящего Postman.

      **Как сделать:**

      1. В Postman нажми **+** (новая вкладка запроса). Метод `GET`, адрес
         `{{BASE_URL}}/api/echo`.
      2. Вкладка **Headers** → добавь строку: Key `X-Student-Id`, Value — твой личный
         код (он в панели «Твой Postman» справа, кнопка «Скопировать»).
      3. Нажми **Send**.

      **Что должно быть:**
      - в Postman — статус `200` и ответ echo-сервера;
      - в панели «Твой Postman» справа — твой запрос в журнале, задание засчитано.

      Не появился запрос в журнале? Проверь, что ключ заголовка написан без
      ошибок (`X-Student-Id`), а значение — твой код целиком.
    expected:
      request: {method: GET, path: /api/echo}
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес: {{BASE_URL}}/api/echo."}
        - {path: body.path, equals: /api/echo, hint: "Запрос ушёл не на тот адрес — нужен {{BASE_URL}}/api/echo."}
        - {path: body.method, equals: GET, hint: "Метод должен быть GET — выбери его слева от адреса."}

  - id: ch03-task2
    order: 2
    phase: 2
    title: "Список тикетов"
    description_md: |
      Посмотри, какие тикеты у тебя есть. У каждого ученика свой учебный набор —
      он создаётся при первом запросе с твоим `X-Student-Id`.

      **Как сделать:** `GET {{BASE_URL}}/api/tickets` с заголовком `X-Student-Id`.

      **Что должно быть:**
      - статус `200`;
      - в теле — `items` (тикеты этой страницы), `page`, `limit`, `total`, `pages`.

      **Ответь себе:** сколько всего тикетов (`total`) и сколько показано на этой
      странице? Почему они не совпадают?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Всего 23 тикета, а на странице — 10: сервер отдаёт список страницами, по
      умолчанию `limit=10`. Остальные — на страницах 2 и 3 (`pages: 3`). Подробнее —
      в разделе 3.6.

      </details>
    expected:
      request: {method: GET, path: /api/tickets}
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Проверь адрес: {{BASE_URL}}/api/tickets."}
        - {path: body.items, exists: true, hint: "В ответе нет списка items — запрос ушёл не на {{BASE_URL}}/api/tickets."}
        - {path: body.total, exists: true, hint: "В ответе нет total — запрос ушёл не на {{BASE_URL}}/api/tickets."}
        - {path: body.page, exists: true, hint: "В ответе нет номера страницы page — нужен список {{BASE_URL}}/api/tickets."}

  - id: ch03-task3
    order: 3
    phase: 2
    title: "Создать тикет"
    description_md: |
      Создай новый тикет.

      **Как сделать:**

      1. Метод `POST`, адрес `{{BASE_URL}}/api/tickets`.
      2. **Headers:** `X-Student-Id` и `Content-Type: application/json`.
      3. **Body** → **raw** → справа выбери **JSON** и вставь:

         ```json
         {"title": "Test ticket", "priority": "medium"}
         ```

      4. **Send.**

      **Что должно быть:**
      - статус `201 Created`;
      - в теле — новый тикет с `id` и `status: "open"`;
      - во вкладке **Headers** ответа — `X-Request-ID`.

      Запомни `id` нового тикета — он пригодится в задании 5.

      **Ответь себе:** что будет, если нажать **Send** ещё раз?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Появится второй такой же тикет с новым `id`: `POST` не идемпотентен (раздел 3.3).
      Так и получаются дубли, когда клиент нажимает кнопку дважды.

      </details>
    expected:
      request:
        method: POST
        path: /api/tickets
        headers: {Content-Type: application/json}
      response:
        - {path: status, equals: 201, hint: "Тикет не создан. Проверь метод (POST), адрес ({{BASE_URL}}/api/tickets), заголовок Content-Type: application/json и JSON в теле. Ответ сервера подскажет, что не так."}
        - {path: body.id, exists: true, hint: "В ответе нет id нового тикета."}
        - {path: body.status, equals: open, hint: "Новый тикет должен быть в статусе open — не передавай status в теле."}
        - {path: headers.x-request-id, exists: true, hint: "В заголовках ответа нет X-Request-ID."}

  - id: ch03-task4
    order: 4
    phase: 2
    title: "PATCH или PUT"
    description_md: |
      Возьми в работу тикет **«Cannot log in to my account»**: поменяй ему статус на
      `in_progress`, остальные поля — название, приоритет, описание — не трогай.

      **Как сделать:**

      1. Найди `id` тикета: `GET {{BASE_URL}}/api/tickets` (он первый в списке).
      2. Отправь `PATCH {{BASE_URL}}/api/tickets/<id>` с заголовками
         `X-Student-Id` и `Content-Type: application/json`
         и телом `{"status": "in_progress"}`.

      **Что должно быть:**
      - статус `200`;
      - `status: "in_progress"`, а `title`, `priority` и `description` — прежние.

      **Ответь себе:** что случилось бы с тем же телом, но методом `PUT`?

      <details markdown="1">
      <summary>Проверь себя</summary>

      `PUT` заменяет тикет целиком, поэтому сервер ответил бы `422`: нет обязательных
      `title` и `priority`. А если прислать `PUT` с `title` и `priority`, но без
      `description`, — описание сотрётся. Отсюда тикеты «после сохранения пропало
      описание».

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Нужен PATCH на {{BASE_URL}}/api/tickets/<id> с Content-Type: application/json. Если пришёл 422 — похоже, это PUT: он требует тикет целиком."}
        - {path: body.title, equals: "Cannot log in to my account", hint: "Это не тот тикет. Найди id тикета «Cannot log in to my account» в списке GET {{BASE_URL}}/api/tickets."}
        - {path: body.status, equals: in_progress, hint: "Статус должен стать in_progress. Тело: {\"status\": \"in_progress\"}."}
        - {path: body.priority, equals: high, hint: "Приоритет изменился, а трогать его не нужно. Верни набор тикетов (POST {{BASE_URL}}/api/tickets/reset) и пришли в PATCH только status."}
        - {path: body.description, equals: "Says 'Wrong password', but it is correct.", hint: "Описание пропало или изменилось — похоже, был PUT: он заменяет тикет целиком. Верни набор тикетов (POST {{BASE_URL}}/api/tickets/reset) и отправь PATCH только со status."}

  - id: ch03-task5
    order: 5
    phase: 2
    title: "Удалить тикет"
    description_md: |
      Удали тикет «Test ticket», созданный в задании 3.

      **Как сделать** (заголовок `X-Student-Id`):
      `DELETE {{BASE_URL}}/api/tickets/<id>` — `id` тикета из задания 3 (забыл — найди
      его в конце списка, на последней странице: `?page=3`).

      **Что должно быть:** `204 No Content`, тело пустое — это нормально: тикет
      удалён, а возвращать серверу нечего.

      Запомни `id` — он пригодится в следующем задании.
    expected:
      response:
        - {path: status, equals: 204, hint: "Сервер не ответил 204. Нужен DELETE {{BASE_URL}}/api/tickets/<id> с id тикета «Test ticket». Если пришёл 404 — такого id нет: найди тикет в списке GET {{BASE_URL}}/api/tickets?page=3."}

  - id: ch03-task6
    order: 6
    phase: 2
    title: "Проверить, что удалён"
    description_md: |
      Убедись, что тикет, удалённый в задании 5, действительно пропал.

      **Как сделать** (заголовок `X-Student-Id`):
      `GET {{BASE_URL}}/api/tickets/<id>` — тот же адрес, что в задании 5, только метод
      `GET`.

      **Что должно быть:** `404 Not Found`, в теле `error: "not_found"`.

      **Ответь себе:** что вернёт повторный `DELETE` того же тикета? Это нарушает
      идемпотентность?

      <details markdown="1">
      <summary>Проверь себя</summary>

      `404`: тикета уже нет. Идемпотентность не нарушена — повтор ничего нового не
      удалил, состояние данных то же, что после первого `DELETE`.

      </details>
    expected:
      response:
        - {path: status, equals: 404, hint: "Ожидается 404: тикета уже нет. Отправь GET на адрес тикета, удалённого в задании 5: {{BASE_URL}}/api/tickets/<id>. Пришёл 200 — этот тикет ещё есть, id не тот (или задание 5 не выполнено)."}
        - {path: body.error, equals: not_found, hint: "Нужен GET тикета, удалённого в задании 5: сервер должен ответить not_found. Проверь адрес — {{BASE_URL}}/api/tickets/<id>."}

  - id: ch03-task7
    order: 7
    phase: 2
    title: "Конфликт"
    description_md: |
      Клиент пишет: «Хочу поднять приоритет у вопроса **„How do I change my email?“**,
      а сервер отвечает ошибкой». Воспроизведи.

      **Как сделать:**

      1. Найди `id` тикета «How do I change my email?» в списке.
      2. `PATCH {{BASE_URL}}/api/tickets/<id>` с заголовками `X-Student-Id`,
         `Content-Type: application/json` и телом
         `{"priority": "high"}`.

      **Что должно быть:** `409 Conflict`, в теле `error: "ticket_closed"`.
      Прочитай `message`.

      **Ответь себе:** кто виноват — клиент или сервер? Что ответить клиенту?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Никто не «сломал»: запрос написан верно, но тикет закрыт, а закрытый тикет
      менять нельзя. Это `409` — конфликт с состоянием данных. Ответ: «Обращение
      закрыто. Сначала его нужно открыть заново (`PATCH {"status": "open"}`), потом
      можно менять приоритет».

      </details>
    expected:
      response:
        - {path: status, equals: 409, hint: "Ожидается 409 Conflict. Меняй закрытый тикет «How do I change my email?» — найди его id в списке. Если пришёл 404 — id не тот."}
        - {path: body.error, equals: ticket_closed, hint: "Ошибка должна быть ticket_closed — меняй именно закрытый тикет."}

  - id: ch03-task8
    order: 8
    phase: 2
    title: "Тикет-«невидимка»"
    description_md: |
      Клиент пишет: «Я создавал обращение **„SMS code not received“**, а в списке
      его нет! Вы его потеряли?»

      **Как сделать** (заголовок `X-Student-Id`):
      `GET {{BASE_URL}}/api/tickets`, во вкладке **Params** добавь `page` = `2`.

      **Что должно быть:** статус `200`, в `items` — тикет «SMS code not received».

      **Ответь себе:** что написать клиенту?

      <details markdown="1">
      <summary>Пример ответа</summary>

      > «Ваше обращение на месте — оно на второй странице списка. Пролистайте
      > список вниз или нажмите „Далее“.»

      </details>
    expected:
      request:
        method: GET
        path: /api/tickets
        query: {page: 2}
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Нужен GET {{BASE_URL}}/api/tickets?page=2."}
        - {path: body.page, equals: 2, hint: "Это не вторая страница. Добавь в Params параметр page = 2."}
        - {path: body.items, contains: {title: "SMS code not received"}, hint: "На этой странице тикета «SMS code not received» нет. Проверь limit: при limit=10 он на 2-й странице. Удалял тикеты из набора — верни его: POST {{BASE_URL}}/api/tickets/reset."}

  - id: ch03-task9
    order: 9
    phase: 2
    title: "Слишком часто"
    description_md: |
      Учебный эндпоинт `{{BASE_URL}}/api/limited` разрешает 3 запроса за 10 секунд.

      **Как сделать** (заголовок `X-Student-Id`):
      отправь `GET {{BASE_URL}}/api/limited` несколько раз подряд, пока не получишь
      `429 Too Many Requests`.

      **Что должно быть:** статус `429`, во вкладке **Headers** ответа — заголовок
      `Retry-After`: через сколько секунд можно повторить.
    expected:
      response:
        - {path: status, equals: 429, hint: "Нужен ответ 429. Отправь GET {{BASE_URL}}/api/limited несколько раз подряд — больше 3 за 10 секунд."}
        - {path: headers.retry-after, exists: true, hint: "В ответе 429 должен быть заголовок Retry-After."}

  - id: ch03-task10
    order: 10
    phase: 2
    title: "Повторить после паузы"
    description_md: |
      Сервер ответил `429` в задании 9. Повтори запрос так, чтобы он прошёл.

      **Как сделать** (заголовок `X-Student-Id`):
      подожди столько секунд, сколько было в `Retry-After`, и отправь
      `GET {{BASE_URL}}/api/limited` один раз.

      **Что должно быть:** статус `200`, в теле `ok: true`.

      **Сформулируй ответ клиенту**, который пишет «приложение выдаёт ошибку 429».

      <details markdown="1">
      <summary>Пример ответа</summary>

      > «Ошибка означает, что за короткое время было слишком много запросов — это
      > защита сервера, данные не пострадали. Подождите несколько секунд и повторите.»

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Нужен ответ 200. Пришёл 429 — ещё рано: подожди столько секунд, сколько написано в Retry-After, и отправь один запрос на {{BASE_URL}}/api/limited."}
        - {path: body.ok, equals: true, hint: "Запрос ушёл не туда — нужен адрес {{BASE_URL}}/api/limited."}

  - id: ch03-task11
    order: 11
    phase: 2
    title: "Мини-тикет: 422 — воспроизвести"
    description_md: |
      Разработчик интеграции пишет:

      > «Беру тикет „Promo code does not work“ в работу, отправляю
      > `PUT /api/tickets/<id>` с телом
      > `{"title": "Promo code does not work", "status": "in_progress"}`
      > и получаю `422`. Что не так?»

      Воспроизведи ошибку.

      **Как сделать** (заголовки `X-Student-Id` и
      `Content-Type: application/json`):

      1. Найди `id` тикета «Promo code does not work» — он 10-й, последний на первой
         странице `GET {{BASE_URL}}/api/tickets`.
      2. `PUT {{BASE_URL}}/api/tickets/<id>`, **Body** → **raw** → **JSON**, тело ровно
         как у разработчика:

         ```json
         {"title": "Promo code does not work", "status": "in_progress"}
         ```

      **Что должно быть:** `422`. Посмотри в теле ответа `details.missing` — какого
      поля не хватает.
    expected:
      response:
        - {path: status, equals: 422, hint: "Ожидается 422. Отправь PUT с телом ровно как у разработчика — без priority. Пришёл 200 — в теле есть priority, а у разработчика его не было; 404 — id не тот."}
        - {path: body.details.missing, contains: priority, hint: "В 422 должно не хватать именно поля priority — отправь тело ровно как у разработчика."}

  - id: ch03-task12
    order: 12
    phase: 2
    title: "Мини-тикет: 422 — исправить"
    description_md: |
      Исправь запрос разработчика из задания 11, чтобы сервер его принял.

      **Как сделать** (заголовки `X-Student-Id` и
      `Content-Type: application/json`): тот же `PUT {{BASE_URL}}/api/tickets/<id>`,
      но добавь в тело недостающее поле из `details.missing` с прежним значением
      (`low`):

      ```json
      {"title": "Promo code does not work", "priority": "low", "status": "in_progress"}
      ```

      **Что должно быть:** `200`, тикет в статусе `in_progress`.

      **Посмотри на ответ:** что стало с полем `description`?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Описание стало пустым: `PUT` заменяет тикет целиком, а `description` в теле не
      было. Ошибки больше нет, но исправление «в лоб» стёрло данные. Поэтому для смены
      статуса правильнее `PATCH {"status": "in_progress"}` — как в задании 4.

      </details>

      **Сформулируй ответ разработчику** в 1–2 предложениях.

      <details markdown="1">
      <summary>Пример ответа</summary>

      > «`PUT` заменяет тикет целиком, поэтому в теле нужны все обязательные поля —
      > не хватает `priority` (см. `details.missing` в ответе). Чтобы поменять только
      > статус, используйте `PATCH`: `PUT` без `description` сотрёт описание.»

      </details>
    expected:
      response:
        - {path: status, equals: 200, hint: "Сервер не ответил 200. Пришёл 422 — в теле не хватает поля из details.missing: добавь \"priority\": \"low\"."}
        - {path: body.title, equals: "Promo code does not work", hint: "Это не тот тикет — нужен «Promo code does not work», а title в теле — без изменений."}
        - {path: body.status, equals: in_progress, hint: "Тикет должен перейти в статус in_progress — оставь status в теле."}

  - id: ch03-task13
    order: 13
    phase: 2
    title: "Мини-тикет: 503 и эскалация"
    description_md: |
      Клиент пишет: «Открываю раздел заказов — „Сервис временно недоступен“. Что с
      моим аккаунтом?» Воспроизведи ошибку и собери данные для эскалации.

      **Как сделать** (заголовок `X-Student-Id`):

      1. `GET {{BASE_URL}}/api/status/503` — учебный адрес, который всегда отвечает
         `503 Service Unavailable`.
      2. Во вкладке **Headers** ответа найди `X-Request-ID`. В теле ответа то же
         значение лежит в поле `request_id` — сравни их.

      **Что должно быть:** статус `503`, в теле — `request_id`, в заголовках ответа —
      `X-Request-ID`.

      **Ответь себе:** кто виноват — клиент или сервер? Что написать клиенту и что —
      разработчикам?

      <details markdown="1">
      <summary>Проверь себя</summary>

      Клиент не виноват: `5xx` — проблема на стороне сервера, исправить запрос он не
      может. Клиенту: «Сбой на нашей стороне, мы уже передали его разработчикам.
      Попробуйте повторить чуть позже — данные не пострадали».

      Эскалация разработчикам:

      > `GET /api/status/503` → `503 Service Unavailable`, время: 14:32 (UTC+3),
      > X-Request-ID: `3f2c…` (полностью из заголовка), тело ответа — во вложении.

      Токены и пароли в эскалацию не кладём (раздел 3.5).

      </details>
    expected:
      request: {method: GET, path: /api/status/503}
      response:
        - {path: status, equals: 503, hint: "Нужен ответ 503. Отправь GET {{BASE_URL}}/api/status/503."}
        - {path: body.status, equals: 503, hint: "Запрос ушёл не туда — нужен адрес {{BASE_URL}}/api/status/503."}
        - {path: body.request_id, exists: true, hint: "В теле ответа 503 должно быть поле request_id."}
        - {path: headers.x-request-id, exists: true, hint: "В заголовках ответа нет X-Request-ID."}
