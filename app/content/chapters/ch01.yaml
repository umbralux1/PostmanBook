id: ch01
title: "Первый запрос: HTTP, URL и мини-Postman"
order: 1
phase: 1
estimated_minutes: 35
goal: |
  Понять схему «клиент → запрос → сервер → ответ», разобраться, из чего состоит
  запрос и как устроен адрес, и отправить первые запросы в мини-Postman.
after_completion: |
  После главы ты сможешь: собрать GET-запрос с query-параметрами, разобрать URL
  на части и объяснить, чем параметры в адресе отличаются от тела запроса.
checklist:
  - "Могу объяснить, что такое API и зачем поддержке Postman."
  - "Знаю, из каких четырёх частей состоит HTTP-запрос."
  - "Могу разобрать URL на части: протокол, хост, путь, query-параметры."
  - "Могу объяснить разницу между GET и POST."
  - "Понимаю, чем query-параметр отличается от JSON в теле."
  - "Умею отправить запрос в мини-Postman и найти в ответе свои параметры."
quiz:
  - id: q1
    question: "Что из перечисленного НЕ является частью HTTP-запроса?"
    options:
      A: "Метод"
      B: "URL"
      C: "Статус-код"
      D: "Тело"
    answer: C
    explanation: "Статус-код — часть ответа, а не запроса. Запрос: метод, URL, заголовки, тело."
  - id: q2
    question: "Какие query-параметры в адресе `/api/echo?source=postman&user=student`?"
    options:
      A: "Только `source=postman`"
      B: "`source=postman` и `user=student`"
      C: "`/api/echo`"
      D: "Параметров нет, это тело запроса"
    answer: B
    explanation: "Параметры начинаются после `?` и разделяются `&`: здесь их два."
  - id: q3
    question: "Нужно посмотреть список заявок, ничего не меняя. Какой метод выбрать?"
    options:
      A: "`POST`"
      B: "`GET`"
      C: "`DELETE`"
      D: "`PATCH`"
    answer: B
    explanation: "`GET` только читает данные. `POST`, `PATCH` и `DELETE` что-то создают, меняют или удаляют."
content_md: |
  ## 1.1. Зачем поддержке API и Postman

  Представь тикет:

  > «Здравствуйте! Нажимаю "Сохранить", но заявка не создаётся. Что делать?»

  Пользователь видит только кнопку и результат. Тебе как специалисту поддержки нужно увидеть, **что именно уходит на сервер и что он отвечает**. Без этого остаётся только гадать и пересылать тикет разработчикам.

  Разберём по шагам, что происходит, когда пользователь нажимает кнопку.

  - **Клиент** — программа, которой пользуется человек: сайт в браузере, мобильное приложение, Postman.
  - **Сервер** — программа на удалённом компьютере. Она хранит данные (заявки, пользователей, заказы) и выполняет действия.
  - Клиент и сервер общаются **сообщениями**. Клиент отправляет **запрос** («создай заявку»), сервер присылает **ответ** («готово» или «ошибка»).
  - Правила, по которым составляются эти сообщения, называются **HTTP**. Это общий «язык» интернета: на нём работают почти все сайты и приложения.
  - **API** (читается «эй-пи-ай») — набор адресов и правил, по которым одна программа может обращаться к другой. Например: «чтобы создать заявку, отправь запрос на такой-то адрес вот в таком виде».

  Схема:

  ```
  Клиент (приложение, Postman)  ──запрос──▶  Сервер
                                ◀──ответ──
  ```

  Обычно запросы и ответы скрыты от человека: он видит только кнопки и картинки. **Postman** — программа, которая позволяет **отправить запрос вручную** и увидеть ответ целиком, без «украшений» интерфейса.

  Postman — это клиент. Он не «делает API», а отправляет запросы и честно показывает, что вернул сервер. Именно это и нужно поддержке: воспроизвести проблему, увидеть, что произошло, и объяснить.

  > 💡 **Зачем это в поддержке:** 80% тикетов про API сводятся к «запрос ушёл не тот» или «сервер ответил ошибкой». Postman помогает отличить одно от другого за минуту.

  ## 1.2. Из чего состоит HTTP-запрос

  У любого запроса четыре части. Удобно представлять запрос как письмо:

  | Часть запроса | Аналогия с письмом |
  |---|---|
  | Метод | Что мы просим сделать: «прочитай», «создай», «удали» |
  | URL | Адрес на конверте |
  | Заголовки | Пометки на конверте: «срочно», «на русском», «от кого» |
  | Тело | Само письмо внутри конверта |

  **1. Метод** — что мы хотим сделать. Основные методы:

  | Метод    | Что делает                          | Пример из жизни                       |
  |----------|-------------------------------------|---------------------------------------|
  | `GET`    | Получить данные                     | Открыть список заявок                 |
  | `POST`   | Создать что-то или отправить данные | Создать новую заявку                  |
  | `PUT`    | Заменить объект целиком             | Перезаписать профиль                  |
  | `PATCH`  | Обновить часть объекта              | Изменить только имя                   |
  | `DELETE` | Удалить                             | Удалить заявку                        |

  На первых порах хватит двух: **`GET` — «дай посмотреть»**, **`POST` — «возьми и сохрани»**.

  **2. URL** — куда обращаемся. Например: `https://api.example.com/tickets`. Как устроен адрес, подробно разберём в следующем разделе.

  **3. Заголовки (Headers)** — дополнительные сведения о запросе: в каком формате данные, кто отправляет, на каком языке ответить. Каждый заголовок — пара «название: значение». Пример: `Content-Type: application/json`.

  **4. Тело (Body)** — данные, которые мы отправляем. Обычно тело есть только у `POST`, `PUT` и `PATCH`: им нужно что-то передать серверу. `GET` только просит данные, поэтому тело ему не нужно. Чаще всего тело записывают в формате JSON (о нём — в главе 2).

  Пример запроса целиком:

  ```http
  POST https://api.example.com/tickets
  Content-Type: application/json
  Authorization: Bearer abc123

  {
    "title": "Не работает кнопка",
    "priority": "high"
  }
  ```

  Читается так: «**создай** (`POST`) по **адресу** `…/tickets` то, что лежит в **теле**; тело — это **JSON** (`Content-Type`); вот мой **пропуск** (`Authorization`)».

  > 💡 **Зачем это в поддержке:** когда пользователь говорит «отправляю заявку, а она не создаётся», тебе нужно понять, какой метод, на какой URL, с какими заголовками и телом ушёл. Обычно проблема прячется в одной из этих четырёх частей.

  ## 1.3. Адрес запроса: как устроен URL

  Возьмём адрес:

  ```
  https://api.example.com/tickets?status=open&limit=10
  ```

  Разберём его по частям:

  | Часть | В примере | Что значит |
  |---|---|---|
  | Протокол | `https://` | По каким правилам общаемся. `https` — защищённый вариант HTTP |
  | Хост (домен) | `api.example.com` | Какой сервер. Как название города на конверте |
  | Путь | `/tickets` | Какой раздел на сервере. Как улица и дом |
  | Query-параметры | `?status=open&limit=10` | Уточнения к запросу: «только открытые, не больше 10» |

  **Query-параметры** (их ещё называют параметрами запроса) пишутся в самом конце адреса по правилам:

  - начинаются со знака вопроса `?`;
  - каждый параметр — пара `ключ=значение`;
  - параметры разделяются знаком `&`.

  Примеры:

  - `/api/echo?source=postman` — один параметр: ключ `source`, значение `postman`;
  - `/api/echo?source=postman&user=student` — два параметра.

  Частые ошибки: забыть `?`, поставить второй `?` вместо `&`, сделать пробел внутри адреса.

  **Чем query-параметр отличается от тела?** Параметры — часть адреса. Они короткие, их видно в строке URL, и обычно ими что-то *уточняют* или *фильтруют*: «покажи заявки со статусом open». Тело — отдельная часть запроса, туда кладут *данные, которые нужно сохранить*: текст заявки, профиль пользователя. Поэтому у `GET` обычно есть параметры и нет тела, а у `POST` есть тело.

  > 💡 **Зачем это в поддержке:** пользователь пишет «фильтр не работает» — первым делом смотришь на параметры в URL. Часто там опечатка в ключе (`stauts=open`) или лишний `?`.

  ## 1.4. Где ты будешь тренироваться

  ### Мини-Postman

  Справа (на телефоне — ниже) на этой странице есть **мини-Postman** — упрощённая копия настоящего. Устроен он так же:

  1. **Строка запроса** сверху: метод (`GET`, `POST`…), адрес и кнопка **Send** («отправить»).
  2. **Вкладки** под ней:
     - **Params** — query-параметры в виде таблицы; всё, что ты сюда впишешь, само появится в адресе после `?`;
     - **Headers** — заголовки;
     - **Body** — тело. `none` — без тела, `raw JSON` — поле для JSON. Если JSON сломан, под полем появится красная подсказка;
     - **Console** — журнал: что именно ушло на сервер и что пришло назад.
  3. **Ответ** внизу: статус-код (цветом: зелёный — 2xx, жёлтый — 4xx, красный — 5xx), время, размер и тело ответа.

  **Адрес всегда полный.** Учебный сервер работает на этом же сайте, поэтому в заданиях указан его полный адрес: `{{BASE_URL}}/api/echo`. Протокол — `http://` или `https://`, хост — адрес сайта, путь — `/api/echo` (см. раздел 1.3). Мини-Postman сразу подставляет этот адрес в строку запроса.

  Если написать только путь, `/api/echo`, мини-Postman сам допишет протокол и хост — так же делает браузер. В настоящем Postman так не получится: там адрес **всегда** пишется полностью, иначе запрос никуда не уйдёт. Поэтому привыкай сразу к полному адресу.

  Чтобы начать задание, нажми **«Решать»** на его карточке. После каждого **Send** тренажёр проверит запрос и покажет, всё ли получилось. Если нет — подскажет, что поправить.

  ### Учебный сервер echo

  Почти все задания отправляются на адрес `{{BASE_URL}}/api/echo`. Это **echo-сервер** («эхо»): он ничего не сохраняет, а просто **возвращает обратно всё, что получил**. Так можно своими глазами увидеть, как сервер «видит» твой запрос:

  - `method` — каким методом пришёл запрос;
  - `args` — query-параметры из адреса;
  - `headers` — заголовки (названия сервер приводит к маленьким буквам: `Content-Type` → `content-type`);
  - `json` — тело, если оно было корректным JSON.

  Важно: когда echo отвечает `200` на `POST`, это **не значит, что что-то создалось**. Это значит «я получил вот это» — и показывает, что именно.

  Ещё есть `{{BASE_URL}}/api/status/<код>`: он просто отвечает тем статус-кодом, который ты указал в адресе. Например, `{{BASE_URL}}/api/status/404` всегда вернёт `404`. Так можно посмотреть на ошибки, ничего не ломая.

  ### Настоящий Postman (забегая вперёд)

  В следующих главах ты перейдёшь в настоящий Postman. Там те же вкладки и та же логика, плюс:

  - **Workspace** — рабочее пространство, где живут твои запросы;
  - **Collection** — папка для сохранённых запросов, чтобы не собирать их заново;
  - **Authorization** — отдельная вкладка для токенов;
  - **Postman Console** — открывается через `Ctrl+Alt+C` (`Cmd+Option+C` на Mac) или через меню `View → Show Postman Console`.

  > 💡 **Зачем это в поддержке:** Console — главный инструмент диагностики. Она показывает запрос таким, каким он ушёл на самом деле. Если что-то непонятно — сначала открывай Console.

  ## Словарик

  | Слово | Простыми словами |
  |---|---|
  | Клиент | Программа, которая отправляет запрос (браузер, приложение, Postman) |
  | Сервер | Программа, которая принимает запрос и отвечает |
  | API | Набор адресов и правил, по которым программы общаются |
  | HTTP | «Язык» запросов и ответов в интернете |
  | Endpoint (эндпоинт) | Конкретный адрес API, например `/api/tickets` |
  | Метод | Что сделать: `GET`, `POST`, `PUT`, `PATCH`, `DELETE` |
  | Query-параметр | Уточнение в адресе после `?`: `?status=open` |
  | Заголовок | Дополнительное сведение о запросе: `Content-Type: application/json` |
  | Тело (body) | Данные внутри запроса или ответа |
