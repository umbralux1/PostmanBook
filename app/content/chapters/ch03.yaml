id: ch03
title: "Методы HTTP и статус-коды в диагностике"
order: 3
phase: 2
reset: [tickets]  # Reset database возвращает к началу эти учебные данные
estimated_minutes: 100
goal: |
  Научиться по коду и телу ошибки понять, кто виноват: запрос клиента или сервер.
after_completion: |
  После главы ты сможешь: отправлять запросы из настоящего Postman, создавать, менять и удалять тикеты разными методами, объяснить разницу между PUT и PATCH, разобрать ответы 201, 204, 409, 422, 429, 502, 503, найти тикет на другой странице списка и приложить X-Request-ID к эскалации.
checklist:
  - "Умею отправить запрос из настоящего Postman и добавить в него заголовки."
  - "Знаю, что делают GET, POST, PUT, PATCH и DELETE, и чем PUT отличается от PATCH."
  - "Знаю, какие запросы безопасно повторить, а какие создадут дубль."
  - "По коду и телу ответа могу сказать, кто виноват: запрос или сервер."
  - "Знаю, где найти X-Request-ID и зачем прикладывать его к эскалации."
  - "Умею листать список через page и limit и смотреть total."
  - "Знаю, что ответить клиенту на 429 и где взять Retry-After."
quiz:
  - id: q1
    question: "Клиент нажал «Создать заявку» дважды, и появились две одинаковые заявки. Почему?"
    options:
      A: "Сервер сломался, это 5xx"
      B: "POST не идемпотентен: каждый запрос создаёт новую заявку"
      C: "Клиент использовал PUT"
      D: "Не хватило заголовка Content-Type"
    answer: B
    explanation: "Повтор POST — это ещё одна заявка. GET, PUT и DELETE можно повторить без нового результата, а POST — нет."
  - id: q2
    question: "Нужно поменять у тикета только статус. Какой запрос подходит лучше?"
    options:
      A: "`PUT` с телом `{\"status\": \"closed\"}`"
      B: "`PATCH` с телом `{\"status\": \"closed\"}`"
      C: "`POST` с телом `{\"status\": \"closed\"}`"
      D: "`GET` с параметром `?status=closed`"
    answer: B
    explanation: "PATCH меняет только присланные поля. PUT заменяет тикет целиком: без title и priority вернёт 422, а неприсланное описание сотрёт."
  - id: q3
    question: "Клиент получил `422` с телом `{\"details\": {\"missing\": [\"priority\"]}}`, а другой клиент — `502 Bad Gateway`. Кто виноват?"
    options:
      A: "В обоих случаях сервер"
      B: "В обоих случаях запрос клиента"
      C: "422 — запрос клиента (нет поля priority), 502 — сервер, эскалируем"
      D: "422 — сервер, 502 — клиент"
    answer: C
    explanation: "4xx — сервер понял запрос и отказал: ищем ошибку в запросе. 5xx — проблема на стороне сервера или сервисов за ним: собираем данные и эскалируем."
  - id: q4
    question: "В ответе `429 Too Many Requests` есть заголовок `Retry-After: 7`. Что он значит?"
    options:
      A: "Запрос можно повторить через 7 секунд"
      B: "У клиента осталось 7 запросов"
      C: "Сервер упадёт через 7 секунд"
      D: "Нужно повторить запрос 7 раз"
    answer: A
    explanation: "Retry-After — через сколько секунд повторить запрос. Клиенту: «подождите немного и повторите, ничего не сломалось»."
  - id: q5
    question: "Что обязательно приложить к эскалации ошибки `503` разработчикам?"
    options:
      A: "Скриншот главной страницы"
      B: "Токен пользователя из заголовка Authorization"
      C: "X-Request-ID, время, метод и адрес запроса"
      D: "Только текст «у клиента не работает»"
    answer: C
    explanation: "По X-Request-ID и времени разработчики найдут запрос в логах. Токен в тикет не кладём никогда."
content_md: |
  В главах 1–2 ты работал во встроенном мини-Postman. Теперь — **настоящий Postman**:
  так ты будешь проверять запросы на работе. Здесь же разберём методы на примере
  тикетов и научимся по коду ответа понимать, кто виноват.

  ## 3.1. Переходим в настоящий Postman

  **Установи Postman.** Скачай приложение с сайта postman.com (раздел Downloads),
  установи и запусти. Аккаунт можно не создавать: на первом экране есть ссылка
  вроде «Skip and go to the app» / «Continue without an account».

  **Всё знакомо.** Окно Postman устроено так же, как мини-Postman: слева метод
  (`GET`, `POST`…), рядом поле адреса, под ним вкладки **Params**, **Headers**,
  **Body**, справа кнопка **Send**. Ответ — внизу: статус, время, вкладки **Body**
  и **Headers**. Новая вкладка запроса — кнопка **+**.

  **Личный код.** Сайт не видит твой Postman, поэтому каждый запрос подписываем
  заголовком (вкладка **Headers**, строка Key / Value): Key `X-Student-Id`, Value —
  твой личный код. По нему сервер понимает, что это ты: свои тикеты, свой журнал.
  Код есть в панели **«Твой Postman»** справа (кнопка «Скопировать»), он один на все
  задания. Без `X-Student-Id` запрос не попадёт в журнал.

  **Какое задание решаешь** — выбирается на странице, как в главах 1–2: кнопкой
  «Решать» на карточке или само, когда предыдущее задание засчитано. Запрос из Postman
  засчитывается заданию, которое выбрано в момент отправки.

  **Как проверяется.** Сервер записывает каждый твой запрос и свой ответ на него.
  Панель «Твой Postman» показывает журнал сразу, без перезагрузки страницы, и сверяет
  ответы с заданием. Сайт не может отправить запрос за тебя — только посмотреть,
  что пришло.

  > ⚠️ **Учебный API — песочница.** Тикеты здесь — учебные: у каждого ученика свой
  > набор из 23 тикетов (названия на английском). Ломай смело: вернуть набор можно
  > запросом `POST {{BASE_URL}}/api/tickets/reset` с заголовком `X-Student-Id`.
  > Кнопка **Reset database** в шапке страницы начинает главу заново: тикеты как в
  > начале, прогресс по заданиям и тесту главы обнуляется.

  ## 3.2. Методы на примере тикетов

  Адрес один — `{{BASE_URL}}/api/tickets`, а действие задаёт метод:

  | Запрос | Что делает | Успешный ответ |
  |---|---|---|
  | `GET /api/tickets` | список тикетов | `200` |
  | `GET /api/tickets/5` | один тикет с `id` 5 | `200` |
  | `POST /api/tickets` | создать тикет (тело — JSON) | `201 Created` |
  | `PUT /api/tickets/5` | заменить тикет 5 целиком | `200` |
  | `PATCH /api/tickets/5` | поменять у тикета 5 только присланные поля | `200` |
  | `DELETE /api/tickets/5` | удалить тикет 5 | `204 No Content` |

  У тикета есть поля `title` (название), `priority` (`low`, `medium`, `high`),
  `status` (`open`, `in_progress`, `closed`) и `description`. Обязательны `title` и
  `priority`. Для `POST`, `PUT` и `PATCH` не забудь заголовок
  `Content-Type: application/json` — без него сервер ответит `415`.

  **PUT и PATCH** — главное отличие. `PUT` присылает тикет **целиком**: чего нет в
  теле, того не станет (описание сотрётся, статус станет `open`). `PATCH` меняет
  **только** присланные поля, остальное не трогает.

  ```
  PATCH /api/tickets/5   {"status": "in_progress"}
  → title, priority и description прежние, status = in_progress

  PUT /api/tickets/5     {"status": "in_progress"}
  → 422: не хватает title и priority
  ```

  > 💡 **Зачем это в поддержке:** «после сохранения пропало описание» — частый тикет.
  > Нередко причина в том, что приложение отправляет `PUT` с неполными данными.

  ## 3.3. Идемпотентность: что можно повторить

  **Идемпотентный** запрос можно повторить сколько угодно раз — результат будет как
  после первого.

  - `GET` — ничего не меняет, повторять можно всегда.
  - `PUT` — второй раз запишет то же самое.
  - `DELETE` — тикет уже удалён; повтор вернёт `404`, но ничего нового не удалит.
  - `POST` — **не идемпотентен**: каждый повтор создаёт новый тикет.

  Отсюда частый тикет: «клиент нажал кнопку дважды — появились две заявки»
  (или два списания). Это не сбой сервера, а два `POST`. Что ответить: удалим дубль,
  а разработчикам — передать, что кнопку стоит блокировать после первого нажатия.

  ## 3.4. Коды ответа в диагностике

  Из главы 2 ты знаешь: `2xx` — успех, `4xx` — ошибка в запросе, `5xx` — ошибка
  сервера. Новые коды этой главы:

  | Код | Что значит | Что делаем |
  |---|---|---|
  | `201 Created` | создано, в теле — новый объект с `id` | всё хорошо |
  | `204 No Content` | готово, тела нет (обычно после `DELETE`) | всё хорошо, пустое тело — это нормально |
  | `409 Conflict` | запрос верный, но мешает состояние данных (например, тикет закрыт) | читаем `message`: что сделать сначала |
  | `422 Unprocessable Entity` | JSON верный, но данные не подходят: нет поля, неверное значение | смотрим `details` в теле: какое поле |
  | `429 Too Many Requests` | слишком много запросов | ждём `Retry-After` секунд и повторяем |
  | `502 Bad Gateway` | сервер получил плохой ответ от сервиса за ним | эскалируем |
  | `503 Service Unavailable` | сервис временно недоступен (перегрузка, работы) | проверяем статус-страницу, эскалируем |

  **Правило: `4xx` — разбираемся сами, `5xx` — эскалируем.** При `4xx` сервер понял
  запрос и объяснил, что не так: смотрим тело ответа (`error`, `message`, `details`)
  и исправляем запрос. При `5xx` клиент не виноват: собираем данные и передаём
  разработчикам.

  Исключения из правила:

  - `429` — ничего чинить не нужно, достаточно подождать;
  - `409` — запрос написан правильно, мешает состояние данных: сначала поменять его
    (например, открыть тикет), потом повторить.

  Тело ошибки учебного API всегда одного вида:

  ```json
  {
    "error": "validation_error",
    "message": "Не хватает обязательных полей: priority",
    "details": {"missing": ["priority"], "invalid": {}}
  }
  ```

  ## 3.5. X-Request-ID: номер запроса для эскалации

  Каждый ответ учебного API несёт заголовок **`X-Request-ID`** — уникальный номер
  запроса. В Postman он во вкладке **Headers** ответа (не путай с Headers запроса).
  Тот же номер сервер пишет в свой журнал (лог), поэтому разработчик по нему за
  секунды найдёт именно этот запрос. В ответах `5xx` номер есть и в теле — поле
  `request_id`.

  Что приложить к эскалации:

  - `X-Request-ID`;
  - время запроса;
  - метод и адрес (без токена!);
  - статус-код и тело ответа.

  ## 3.6. Пагинация: «не вижу в списке» ≠ «нет»

  Список может быть длинным, поэтому сервер отдаёт его **страницами**:

  ```
  GET {{BASE_URL}}/api/tickets?page=2&limit=10
  ```

  - `page` — номер страницы (с 1);
  - `limit` — сколько записей на странице (здесь по умолчанию 10);
  - в ответе: `items` — записи этой страницы, `total` — сколько всего,
    `pages` — сколько страниц.

  Если клиент «не видит свой тикет», первым делом посмотри `total` и `pages`: возможно,
  тикет просто на следующей странице.

  ## 3.7. Rate limit: 429 и Retry-After

  Чтобы один клиент не перегрузил сервер, у API есть **лимит запросов** (rate limit):
  например, не больше 3 запросов за 10 секунд. Сверх лимита сервер отвечает
  `429 Too Many Requests` и в заголовке **`Retry-After`** пишет, через сколько секунд
  можно повторить.

  Учебный эндпоинт: `GET {{BASE_URL}}/api/limited` — 3 запроса за 10 секунд на ученика.

  Что сказать клиенту: «Запросов было слишком много подряд, это защита сервера.
  Подождите N секунд и повторите — данные не пострадали».

  ## Словарик

  | Слово | Простыми словами |
  |---|---|
  | Метод | Что сделать с адресом: `GET` прочитать, `POST` создать, `PUT`/`PATCH` изменить, `DELETE` удалить |
  | Идемпотентность | Повтор запроса не меняет результат (`GET`, `PUT`, `DELETE`) |
  | `X-Request-ID` | Уникальный номер запроса в заголовке ответа — для поиска в логах |
  | Пагинация | Выдача списка по страницам: `page`, `limit`, `total` |
  | Rate limit | Лимит запросов за время; сверх него — `429` |
  | `Retry-After` | Заголовок: через сколько секунд повторить запрос |
  | Эскалация | Передача проблемы разработчикам с собранными данными |
