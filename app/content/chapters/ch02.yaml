id: ch02
title: "Ответ сервера: статус-коды, JSON и заголовки"
order: 2
phase: 1
estimated_minutes: 55
goal: |
  Научиться читать ответ сервера: статус-код, заголовки и тело, — отправлять JSON
  и по ответу понимать, где проблема: в запросе или на сервере.
after_completion: |
  После главы ты сможешь: отправить POST с JSON, найти статус-код и тело ответа,
  открыть Console, объяснить разницу между 2xx, 4xx и 5xx и найти ошибку в JSON из тикета.
checklist:
  - "Знаю, что означают 200, 400, 401, 403, 404, 500."
  - "Умею найти статус-код ответа в Postman."
  - "Умею открыть Console и найти там заголовки и тело запроса."
  - "Могу найти ошибку в JSON: кавычки, запятые, строка или число."
  - "Знаю, зачем нужен заголовок Content-Type: application/json."
  - "Понимаю, почему нельзя проверять всё на production и светить токены."
quiz:
  - id: q1
    question: "Пользователь получил `404 Not Found`. Что проверить первым?"
    options:
      A: "Правильность токена"
      B: "Правильность URL и параметров"
      C: "Наличие прав у пользователя"
      D: "Логи сервера"
    answer: B
    explanation: "404 — сервер не нашёл ресурс по этому адресу. Сначала проверяем URL, путь и параметры (например, id объекта)."
  - id: q2
    question: "Пользователь получил `500 Internal Server Error`. Кто вероятнее всего виноват?"
    options:
      A: "Пользователь"
      B: "Приложение на стороне клиента"
      C: "Сервер"
      D: "Postman"
    answer: C
    explanation: "5xx — ошибка на стороне сервера. Собираем детали запроса и эскалируем разработчикам."
  - id: q3
    question: "Какой из вариантов — корректный JSON?"
    options:
      A: "`{\"priority\": high}`"
      B: "`{'priority': 'high'}`"
      C: "`{\"priority\": \"high\",}`"
      D: "`{\"priority\": \"high\"}`"
    answer: D
    explanation: "Строки и ключи — в двойных кавычках, после последней пары запятой нет."
  - id: q4
    question: "На `POST` с JSON в теле сервер ответил `415 Unsupported Media Type`. Что проверить первым?"
    options:
      A: "Query-параметр в адресе"
      B: "Заголовок `Content-Type: application/json`"
      C: "Заголовок `Accept`"
      D: "Токен в `Authorization`"
    answer: B
    explanation: "415 — сервер не принимает формат тела. Чаще всего забыт заголовок `Content-Type: application/json`, и сервер не знает, что внутри JSON."
  - id: q5
    question: "Где увидеть, какие заголовки и тело на самом деле ушли на сервер?"
    options:
      A: "В панели ответа"
      B: "В Console"
      C: "Во вкладке Params"
      D: "По статус-коду"
    answer: B
    explanation: "Панель ответа показывает только ответ. Console показывает обе стороны: что ушло и что пришло."
content_md: |
  В главе 1 ты отправлял запросы. Теперь разберёмся с тем, что сервер присылает в ответ, и научимся по ответу понимать, где проблема: в запросе или на сервере.

  ## 2.1. Из чего состоит HTTP-ответ

  Ответ тоже устроен просто:

  **1. Статус-код** — главный сигнал. Трёхзначное число, по которому сразу понятно, получилось или нет.

  **2. Заголовки ответа** — сведения от сервера: в каком формате ответ, когда отправлен и т. п.

  **3. Тело ответа** — данные. Почти всегда JSON.

  Пример:

  ```http
  200 OK
  Content-Type: application/json

  {
    "ticket_id": "12345",
    "status": "created"
  }
  ```

  Читается так: «**всё хорошо** (`200 OK`), ответ в формате **JSON**, заявка создана, её номер — 12345».

  ## 2.2. Статус-коды: главный инструмент поддержки

  Все коды делятся на группы. Смысл кода задаёт первая цифра.

  | Группа | Значение                            | Кто виноват чаще        |
  |--------|-------------------------------------|-------------------------|
  | `2xx`  | Успех                               | Никто, всё хорошо       |
  | `3xx`  | Перенаправление                     | В этой главе пропускаем |
  | `4xx`  | Ошибка в запросе (на стороне клиента) | Пользователь / приложение / токен |
  | `5xx`  | Ошибка на сервере                   | Сервер                  |

  Коды, которые надо знать наизусть:

  - `200 OK` — всё хорошо, данные пришли;
  - `201 Created` — объект создан (типичный ответ на `POST`);
  - `400 Bad Request` — запрос составлен неправильно (например, сломанный JSON);
  - `401 Unauthorized` — сервер не знает, кто ты: токена нет, он неверный или просрочен;
  - `403 Forbidden` — сервер знает, кто ты, но этому пользователю действие запрещено;
  - `404 Not Found` — неверный URL или такого объекта нет;
  - `500 Internal Server Error` — сервер сломался, виноват сервер;
  - `502 Bad Gateway` / `503 Service Unavailable` — сервис недоступен.

  Как запомнить разницу между `401` и `403`: `401` — «предъяви пропуск», `403` — «пропуск вижу, но сюда тебе нельзя».

  > 💡 **Зачем это в поддержке:** правило простое — **`4xx` проверяем у себя, `5xx` эскалируем**. Это уже половина диагностики.

  ## 2.3. JSON за 5 минут

  Тело запроса и ответа чаще всего записывают в формате **JSON** (читается «джейсон»). Это способ записать данные так, чтобы их одинаково понимали и люди, и программы.

  ```json
  {
    "ticket_id": "123",
    "status": "open",
    "priority": 2,
    "urgent": true,
    "tags": ["billing", "mobile"]
  }
  ```

  Правила, которых достаточно:

  - весь объект — в фигурных скобках `{ }`;
  - данные — это пары **`"ключ": значение`**, между ключом и значением двоеточие;
  - **ключи всегда в двойных кавычках**: `"status"`, не `status`;
  - пары разделяются запятыми, но **после последней пары запятой нет**;
  - список — в квадратных скобках `[ ]`;
  - вложенный объект — снова в фигурных `{ }`.

  Значения бывают разных типов:

  | Тип | Пример | Важно |
  |---|---|---|
  | Строка | `"open"`, `"123"` | Всегда в **двойных** кавычках |
  | Число | `2`, `3.5` | Без кавычек |
  | Да / нет | `true`, `false` | Без кавычек, маленькими буквами |
  | Пусто | `null` | Без кавычек |
  | Список | `["a", "b"]` | В квадратных скобках |

  Внимание: `"123"` и `123` — **разные вещи**. Первое — строка (текст из цифр), второе — число. Если сервер ждёт строку, а пришло число, он может ответить ошибкой.

  Самые частые ошибки, из-за которых сервер отвечает `400 Bad Request`:

  ```
  {"status": open}          ← слово без кавычек: open — не строка, не число, не true
  {'status': 'open'}        ← одинарные кавычки вместо двойных
  {"status": "open",}       ← лишняя запятая в конце
  {"status": "open" "id": 1} ← пропущена запятая между парами
  ```

  > 💡 **Зачем это в поддержке:** когда пользователь присылает «вот такой запрос», нужно быстро увидеть, что JSON сломан. Это уже готовый ответ в тикете.

  ## 2.4. Заголовки, которые встретятся первыми

  **`Content-Type`** — «в каком формате тело». Значение `application/json` говорит серверу: «внутри JSON, разбирай его как JSON».

  Что будет, если его забыть? Сервер получит тело, но не поймёт, что это JSON. Он может прочитать его как обычный текст, проигнорировать или ответить ошибкой (часто `400` или `415 Unsupported Media Type`). Поэтому правило: **отправляешь JSON в теле — добавь `Content-Type: application/json`**.

  **`Accept`** — «в каком формате я хочу получить ответ». Например, `Accept: application/json`.

  **`Authorization`** — «пропуск». Сервер не знает, кто его вызывает, поэтому к запросу прикладывают **токен** — длинную секретную строку, которую сервер выдал при входе в систему. Чаще всего это выглядит так:

  ```
  Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
  ```

  `Bearer` переводится как «предъявитель»: кто предъявил токен, того сервер и считает владельцем.

  ## 2.5. Безопасность: токены и production

  Токен — это **ключ от аккаунта**. Любой, у кого он есть, может действовать от имени пользователя: смотреть его данные, создавать и удалять заявки. Поэтому:

  - **никогда не вставляй настоящий токен** в скриншоты, тикеты, чаты, учебные запросы;
  - если нужно показать запрос коллеге — замени токен на `***`;
  - если токен случайно «утёк» — сообщи, чтобы его отозвали.

  **Production** (прод, боевая среда) — это настоящая система, с которой работают реальные клиенты. Там же есть **тестовая среда** (её называют test, stage или sandbox) — копия для проверок.

  Почему нельзя «просто проверить» на production: запрос `POST` создаст **настоящую** заявку, `DELETE` удалит **настоящие** данные, и отменить это может быть нельзя. Проверяем на тестовой среде, на production — только чтение (`GET`) и только если это разрешено.

  > ⚠️ **В этом курсе — только тестовые данные.** Тренажёр — песочница: здесь ничего нельзя сломать.

  ## Словарик

  | Слово | Простыми словами |
  |---|---|
  | Заголовок | Дополнительное сведение о запросе: `Content-Type: application/json` |
  | Тело (body) | Данные внутри запроса или ответа |
  | JSON | Формат записи данных: `{"ключ": "значение"}` |
  | Статус-код | Трёхзначное число в ответе: `200`, `404`, `500` |
  | Токен | Секретный «пропуск» к аккаунту |
  | Production | Настоящая система с реальными клиентами |
