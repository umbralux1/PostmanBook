id: ch07
title: "Финальные кейсы: полный цикл поддержки"
order: 7
phase: 3
estimated_minutes: 120
goal: |
  Пройти полный цикл: тикет → воспроизвести → найти причину → проверить решение.
content_md: |
  > **Глава готовится.** Кейсы появятся позже.

  Что будет в главе:

  - от тикета к воспроизведению проблемы;
  - когда решать самому, а когда эскалировать;
  - что приложить к эскалации;
  - как объяснить причину простыми словами;
  - пять кейсов: `400` из-за JSON, `401` после смены пароля, `403` из-за прав,
    `404` только на staging, `500` с `request_id`.
