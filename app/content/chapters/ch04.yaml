id: ch04
title: "Авторизация и токены"
order: 4
phase: 2
reset: [auth]  # Reset database возвращает к началу эти учебные данные
estimated_minutes: 75
goal: |
  Научиться отличать `401` от `403` и объяснять пользователю разницу.
content_md: |
  > **Глава готовится.** Теория и задания появятся позже.

  Что будет в главе:

  - заголовок `Authorization`: Bearer, API Key, Basic;
  - вкладка Authorization в Postman;
  - `401` и `403`: в чём разница;
  - просроченный и отозванный токен;
  - что делать с токенами, которые присылают в тикетах.
