id: ch04
title: "Авторизация и токены"
order: 4
phase: 2
reset: [auth]  # Reset database возвращает к началу эти учебные данные
estimated_minutes: 80
goal: |
  Научиться отличать `401` от `403` и объяснять пользователю разницу.
after_completion: |
  После главы ты сможешь: получить токен и войти с ним в настоящем Postman, пользоваться вкладкой Authorization (Bearer Token, Basic Auth, API Key), по телу ответа назвать причину 401 (нет пропуска, опечатка, просрочен, отозван) и отличить её от 403, объяснить клиенту, почему после смены пароля нужно войти заново, и правильно обойтись с токеном, присланным в тикете.
checklist:
  - "Знаю разницу: 401 — «кто ты?», 403 — «тебе сюда нельзя»."
  - "Умею получить токен через логин и отправить его в заголовке Authorization: Bearer."
  - "Умею пользоваться вкладкой Authorization в Postman: Bearer Token, Basic Auth, API Key."
  - "Знаю, что Basic — это base64, а не шифрование."
  - "По полю error в теле 401 могу назвать причину: нет пропуска, опечатка, просрочен, отозван."
  - "Знаю, почему после смены пароля старые токены отвечают 401."
  - "Никогда не прошу у клиента пароль, а токен со скриншота прошу отозвать."
quiz:
  - id: q1
    question: "Клиент вошёл в приложение, открывает раздел «Отчёты» и получает `403 Forbidden`. Другие разделы работают. В чём вероятная причина?"
    options:
      A: "Токен истёк — нужно войти заново"
      B: "У учётной записи нет прав на этот раздел"
      C: "Сервер упал — это ошибка 5xx"
      D: "Клиент неправильно ввёл пароль"
    answer: B
    explanation: "403 — сервер знает, кто это, но доступа не даёт. Повторный вход не поможет: права выдаёт администратор. Истёкший токен и неверный пароль — это 401."
  - id: q2
    question: "В запросе заголовок `Authorization: Basic YWdlbnQ6c3VwcG9ydDEyMw==`. Что верно?"
    options:
      A: "Пароль надёжно зашифрован, показывать заголовок можно"
      B: "Это токен, срок которого скоро истечёт"
      C: "Это логин и пароль в base64 — их легко раскодировать, заголовок — такой же секрет, как пароль"
      D: "Это API-ключ"
    answer: C
    explanation: "Base64 — не шифрование, а запись в другом алфавите: «agent:support123» восстанавливается за секунду. Basic-заголовок нельзя показывать никому."
  - id: q3
    question: "Клиент прислал в тикет скриншот Postman, на котором виден его токен целиком. Что делаем?"
    options:
      A: "Используем токен, чтобы проверить его аккаунт"
      B: "Вставляем токен в онлайн-декодер, чтобы понять, что внутри"
      C: "Ничего, токен — не пароль"
      D: "Не используем токен, просим клиента его отозвать (выйти на всех устройствах или сменить пароль), в эскалации токен маскируем"
    answer: D
    explanation: "Токен — временный пропуск: кто его видел, тот может войти. Чужим токеном не пользуемся, на сторонние сайты не вставляем, просим отозвать, в переписке и эскалации маскируем."
  - id: q4
    question: "Клиент сменил пароль на телефоне, и теперь интеграция на сервере отвечает `401` с `error: token_revoked`. Почему?"
    options:
      A: "Смена пароля отзывает выданные раньше токены и ключи — интеграции нужен новый"
      B: "Сервер сломался после смены пароля"
      C: "У клиента отобрали права"
      D: "Интеграция шлёт слишком много запросов"
    answer: A
    explanation: "Так задумано: если пароль утёк, смена пароля «выкидывает» всех, кто вошёл со старым. Решение — войти заново и обновить токен или ключ в интеграции."
  - id: q5
    question: "Клиенту на запрос отвечают `403` с `error: insufficient_role`. Что ему сказать?"
    options:
      A: "«Выйдите и войдите снова»"
      B: "«Пришлите, пожалуйста, ваш пароль, мы проверим»"
      C: "«У вашей учётной записи нет нужной роли. Доступ выдаёт администратор вашей организации — обратитесь к нему»"
      D: "«Это сбой на нашей стороне, мы уже чиним»"
    answer: C
    explanation: "При 403 вход в порядке, не хватает прав. Повторный вход не поможет, пароль не просим никогда, сбоя нет — нужна роль от администратора."
content_md: |
  «Вчера всё работало, сегодня приложение пишет „Ошибка 401“» — один из самых частых
  тикетов. В этой главе разберёмся, как сервер узнаёт, кто прислал запрос, почему
  пропуск перестаёт работать и как по ответу отличить «не пустили» от «нельзя».

  ## 4.1. Кто ты и что тебе можно

  Сервер задаёт запросу два вопроса:

  1. **Кто ты?** — это **аутентификация**. Запрос предъявляет «пропуск»: токен, ключ
     или логин с паролем. Нет пропуска или он не годится — `401 Unauthorized`.
  2. **Что тебе можно?** — это **авторизация**. Сервер знает, кто ты, и проверяет
     права. Прав нет — `403 Forbidden`.

  Аналогия — офис с турникетом. `401`: охранник не пускает, потому что пропуска нет
  или он просрочен. `403`: пропуск в порядке, но в серверную тебе нельзя.

  > 💡 **Главное правило:** при `401` поможет **войти заново** (получить новый
  > пропуск). При `403` повторный вход **не поможет**: нужны права, их выдаёт
  > администратор.

  ## 4.2. Три способа предъявить пропуск

  | Способ | Как выглядит заголовок | Где встречается |
  |---|---|---|
  | **Bearer-токен** | `Authorization: Bearer tok_3f8a…` | приложения и сайты после входа |
  | **Basic** | `Authorization: Basic YWdlbnQ6c3VwcG9ydDEyMw==` | старые системы, внутренние сервисы |
  | **API Key** | `X-API-Key: key_12ab…` | интеграции «сервер — сервер», скрипты |

  - **Bearer** (англ. «предъявитель»): кто предъявил токен, того и пускают. Слово
    `Bearer`, один пробел, токен — без кавычек и двоеточий.
  - **Basic**: логин и пароль через двоеточие (`agent:support123`), записанные в
    **base64**. Base64 — **не шифрование**: раскодировать его может кто угодно за
    секунду. Basic-заголовок — такой же секрет, как пароль.
  - **API Key**: длинный ключ без срока действия, обычно в своём заголовке (у нас —
    `X-API-Key`). Ключ передают **в заголовке, а не в адресе**: адрес запроса
    попадает в логи серверов и в историю браузера.

  ## 4.3. Вкладка Authorization в Postman

  Писать заголовок `Authorization` руками не нужно. Во вкладке **Authorization**
  (рядом с Params и Headers) выбери **Auth Type**:

  - **Bearer Token** — вставь токен в поле **Token**, Postman сам добавит
    `Authorization: Bearer <токен>`;
  - **Basic Auth** — введи **Username** и **Password**, Postman сам закодирует их
    в base64;
  - **API Key** — **Key** (имя заголовка, у нас `X-API-Key`), **Value** (ключ) и
    **Add to**: **Header** (правильно) или **Query Params** (ключ уйдёт в адрес).

  Получившийся заголовок виден во вкладке **Headers** (строки, скрытые по умолчанию,
  открываются кнопкой с глазом, hidden). Не добавляй `Authorization` ещё раз вручную
  в Headers — будет путаница, какой из двух ушёл.

  Заголовок `X-Student-Id` по-прежнему добавляй во вкладке **Headers**: это твой
  личный код для журнала, а не авторизация.

  > Тип **Inherit auth from parent** берёт авторизацию из коллекции — удобно, когда
  > запросов много. О коллекциях — в главе 5.

  ## 4.4. Откуда берётся токен

  Пароль — как паспорт: его показывают один раз, при входе. В ответ сервер выдаёт
  **токен** — временный пропуск, и дальше запросы идут с ним.

  ```
  POST {{BASE_URL}}/api/auth/login
  {"username": "agent", "password": "support123"}

  → 200
  {
    "access_token": "tok_3f8a…",
    "token_type": "Bearer",
    "expires_in": 900,
    "role": "agent"
  }
  ```

  - `access_token` — сам токен, его вставляют в Bearer Token;
  - `token_type: "Bearer"` — как его предъявлять;
  - `expires_in` — сколько секунд токен действует (здесь 15 минут).

  Учебная учётка — логин `agent`, пароль `support123`, роль `agent` (сотрудник
  поддержки). У каждого ученика она своя: смена пароля у тебя не мешает другим.

  > ⚠️ **Учебный API — песочница.** Сменил пароль и забыл — верни учётку:
  > `POST {{BASE_URL}}/api/auth/reset` с заголовком `X-Student-Id` (пароль снова
  > `support123`, все токены и ключи отозваны). Кнопка **Reset database** в шапке
  > страницы делает то же и обнуляет прогресс по заданиям и тесту главы.

  ## 4.5. 401 или 403: диагностика

  Код один, а причин у `401` несколько. Хороший API пишет причину в теле (`error`,
  `message`) и добавляет заголовок **`WWW-Authenticate`** — «как ко мне входить»
  (у нас `Bearer realm="trainer"`).

  | `error` в учебном API | Что случилось | Что делаем |
  |---|---|---|
  | `missing_credentials` | пропуска нет: забыли Authorization, токен ушёл в адрес | добавить авторизацию, токен — в заголовок |
  | `malformed_authorization` | заголовок записан неверно: нет слова `Bearer`, лишнее двоеточие, кавычки | поправить формат: `Bearer <токен>` |
  | `invalid_token` | такого токена нет: опечатка, обрезан при копировании, выдан на другом сайте (staging вместо production) | скопировать токен целиком, проверить адрес сайта |
  | `invalid_credentials` | неверный логин или пароль | проверить данные, при необходимости — сброс пароля |
  | `token_expired` | срок действия истёк | войти заново |
  | `token_revoked` | токен отозван: сменили пароль, «вышли на всех устройствах» | войти заново, обновить токен в интеграции |

  У `403` причина другая — **не хватает прав**: роль не та (`insufficient_role`),
  ресурс принадлежит другому аккаунту. Здесь вход в порядке, и новый токен ничего
  не изменит.

  Что сказать клиенту:

  - `401`: «Сессия устарела или данные входа неверны. Выйдите и войдите снова».
    Если это интеграция — «обновите токен (ключ) в настройках».
  - `403`: «У вашей учётной записи нет доступа к этому разделу. Права выдаёт
    администратор вашей организации».

  ## 4.6. Просроченный и отозванный токен

  Токен живёт недолго специально: если его украли, вор сможет пользоваться им
  только до конца срока. Поэтому `token_expired` — нормальная жизнь токена, а не
  сбой. Приложения обычно сами получают новый токен; если нет — пользователь видит
  «войдите снова».

  **Отзыв** — токен «гасят» раньше срока:

  - **смена пароля** — все старые токены и ключи отзываются: если пароль утёк, вошедшие
    с ним «выпадают»;
  - **«выйти на всех устройствах»** — то же без смены пароля;
  - **отзыв API-ключа** — в настройках интеграции.

  Отсюда тикет: «сменил пароль — и интеграция (бот, выгрузка) отвечает `401`».
  Ответ: интеграция работала со старым токеном или ключом, он отозван; нужно
  получить новый и обновить его в настройках интеграции.

  ## 4.7. Токены в тикетах

  - **Никогда не проси пароль.** Ни в чате, ни по почте, ни «для проверки». Нужен
    доступ — для этого есть свои инструменты и процедуры.
  - **Токен на скриншоте** — такой же секрет: кто его видел, тот может войти. Не
    пользуйся им, попроси клиента отозвать (выйти на всех устройствах или сменить
    пароль), удали или скрой вложение по правилам компании.
  - **В эскалации маскируй**: `Bearer tok_3f…9a` вместо целого токена. Так же делает
    журнал в панели «Твой Postman» — и настоящие логи серверов.
  - **Не вставляй токены на сторонние сайты** (декодеры, «проверялки», онлайн-форматтеры
    JSON): ты не знаешь, кто их сохраняет.
  - **Не используй production-токены клиента** для своих проверок: работай со
    своей тестовой учёткой.

  > Бывают токены, внутри которых записаны данные: кто владелец, роль, срок. Они
  > называются **JWT** — о них отдельная глава. Токены `tok_…` учебного API
  > непрозрачные: по ним самим ничего не понять, всё знает только сервер.

  ## Словарик

  | Слово | Простыми словами |
  |---|---|
  | Аутентификация | Проверка «кто ты»; не прошла — `401` |
  | Авторизация | Проверка «что тебе можно»; прав нет — `403` |
  | Токен | Временный пропуск, который выдают после входа |
  | Bearer | Способ предъявить токен: `Authorization: Bearer <токен>` |
  | Basic | Логин и пароль в base64 в заголовке `Authorization` — не шифрование |
  | API Key | Долгоживущий ключ для интеграций, обычно в своём заголовке (`X-API-Key`) |
  | Роль | Набор прав учётной записи (`agent`, `admin`…) |
  | Отзыв | «Погасить» токен или ключ раньше срока (например, сменой пароля) |
  | `WWW-Authenticate` | Заголовок ответа `401`: каким способом входить |
