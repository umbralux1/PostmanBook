services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # База в томе trainer-data — переживает пересборку и перезапуск контейнера.
      TRAINER_DATABASE_URL: sqlite:////srv/data/trainer.db
    ports:
      - "8000:8000"
    volumes:
      - trainer-data:/srv/data
    restart: unless-stopped

volumes:
  trainer-data:
